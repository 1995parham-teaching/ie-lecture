<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <title>Three ways a guest kernel's privileged instructions reach the hypervisor: binary translation, hypercalls, and VT-x VM exits</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .head { font-size: 20px; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .tiny { font-size: 13px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .guest { fill: rgba(0, 229, 255, 0.10); stroke: #00e5ff; stroke-width: 2; }
    .hv { fill: rgba(238, 130, 238, 0.14); stroke: #ee82ee; stroke-width: 2; }
    .mode { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #ffcc00; stroke-width: 2.5; marker-end: url(#arrow); }
    .ring { font-size: 13px; fill: #8d97a8; text-anchor: start; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffcc00" />
    </marker>
  </defs>

  <!-- 1. Binary translation -->
  <text class="head" x="150" y="20">Binary translation</text>
  <text class="small" x="150" y="44">VMware, 1999</text>
  <rect class="box" x="20" y="66" width="260" height="56" rx="6" />
  <text x="150" y="94">guest apps</text>
  <text class="ring" x="26" y="78">ring 3</text>
  <rect class="guest" x="20" y="136" width="260" height="70" rx="6" />
  <text x="150" y="162">guest kernel</text>
  <text class="small" x="150" y="186"><tspan class="green">unmodified</tspan>, moved out of ring 0</text>
  <rect class="hv" x="20" y="290" width="260" height="70" rx="6" />
  <text class="violet" x="150" y="316">VMM</text>
  <text class="small" x="150" y="340">rewrites privileged code</text>
  <text class="ring" x="26" y="302">ring 0</text>
  <path class="line" d="M150,208 L150,286" />
  <text class="small" x="160" y="236" style="text-anchor: start">translated</text>
  <text class="small" x="160" y="258" style="text-anchor: start">on the fly</text>
  <text class="red" x="150" y="404" style="font-size: 16px">slow on kernel-heavy work</text>

  <!-- 2. Paravirtualization -->
  <text class="head" x="450" y="20">Paravirtualization</text>
  <text class="small" x="450" y="44">Xen, 2003</text>
  <rect class="box" x="320" y="66" width="260" height="56" rx="6" />
  <text x="450" y="94">guest apps</text>
  <text class="ring" x="326" y="78">ring 3</text>
  <rect class="guest" x="320" y="136" width="260" height="70" rx="6" />
  <text x="450" y="162">guest kernel</text>
  <text class="small" x="450" y="186"><tspan class="orange">modified</tspan>: knows it is a guest</text>
  <rect class="hv" x="320" y="290" width="260" height="70" rx="6" />
  <text class="violet" x="450" y="316">hypervisor</text>
  <text class="small" x="450" y="340">serves the hypercalls</text>
  <text class="ring" x="326" y="302">ring 0</text>
  <path class="line" d="M450,208 L450,286" />
  <text class="small" x="460" y="236" style="text-anchor: start">hypercalls</text>
  <text class="small" x="460" y="258" style="text-anchor: start">(like syscalls)</text>
  <text class="red" x="450" y="404" style="font-size: 16px">needs a ported guest OS</text>

  <!-- 3. Hardware-assisted -->
  <text class="head" x="750" y="20">Hardware-assisted</text>
  <text class="small" x="750" y="44">Intel VT-x 2005, AMD-V 2006</text>
  <rect class="mode" x="614" y="58" width="272" height="156" rx="8" />
  <text class="tiny" x="880" y="228" style="text-anchor: end">non-root mode</text>
  <rect class="box" x="620" y="66" width="260" height="56" rx="6" />
  <text x="750" y="94">guest apps</text>
  <text class="ring" x="626" y="78">ring 3</text>
  <rect class="guest" x="620" y="136" width="260" height="70" rx="6" />
  <text x="750" y="162">guest kernel</text>
  <text class="small" x="750" y="186"><tspan class="green">unmodified</tspan>, in its own ring 0</text>
  <text class="ring" x="626" y="148">ring 0</text>
  <rect class="mode" x="614" y="282" width="272" height="86" rx="8" />
  <text class="tiny" x="880" y="380" style="text-anchor: end">root mode</text>
  <rect class="hv" x="620" y="290" width="260" height="70" rx="6" />
  <text class="violet" x="750" y="316">hypervisor</text>
  <text class="small" x="750" y="340">handles the exit, resumes</text>
  <text class="ring" x="626" y="302">ring 0</text>
  <path class="line" d="M720,208 L720,286" />
  <path class="line" d="M780,288 L780,210" />
  <text class="small" x="712" y="248" style="text-anchor: end">VM exit</text>
  <text class="small" x="788" y="248" style="text-anchor: start">VM entry</text>
  <text class="green" x="750" y="404" style="font-size: 16px">no translation, no port</text>

  <text class="small" x="450" y="440">Before VT-x, x86 broke trap-and-emulate: some instructions (e.g. <tspan class="mono yellow">POPF</tspan>) silently</text>
  <text class="small" x="450" y="464">behave differently outside ring 0 instead of trapping into the hypervisor.</text>
</svg>
