<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430">
  <title>Six vCPUs from two VMs are scheduled by the hypervisor onto four physical CPUs</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .vma { fill: rgba(255, 145, 0, 0.12); stroke: #ff9100; stroke-width: 2; }
    .vmb { fill: rgba(118, 255, 3, 0.10); stroke: #76ff03; stroke-width: 2; }
    .hv { fill: rgba(238, 130, 238, 0.14); stroke: #ee82ee; stroke-width: 2; }
    .cpu { fill: rgba(0, 229, 255, 0.10); stroke: #00e5ff; stroke-width: 2; }
    .wait { fill: rgba(255, 255, 255, 0.03); stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 5 4; }
    .la { fill: none; stroke: #ff9100; stroke-width: 2.5; marker-end: url(#aa); }
    .lb { fill: none; stroke: #76ff03; stroke-width: 2.5; marker-end: url(#ab); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; } .violet { fill: #ee82ee; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9100" /></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76ff03" /></marker>
  </defs>

  <rect class="vma" x="20" y="20" width="270" height="130" rx="8" />
  <text class="orange" x="155" y="44">VM A</text>
  <rect class="box" x="40" y="60" width="230" height="30" rx="4" />
  <text class="small" x="155" y="76">guest OS</text>
  <rect class="vma" x="50" y="102" width="90" height="34" rx="4" />
  <rect class="wait" x="170" y="102" width="90" height="34" rx="4" />
  <text x="95" y="120">vCPU 0</text>
  <text class="grey" x="215" y="120">vCPU 1</text>

  <rect class="vmb" x="320" y="20" width="560" height="130" rx="8" />
  <text class="green" x="600" y="44">VM B</text>
  <rect class="box" x="340" y="60" width="520" height="30" rx="4" />
  <text class="small" x="600" y="76">guest OS</text>
  <rect class="vmb" x="350" y="102" width="100" height="34" rx="4" />
  <rect class="wait" x="480" y="102" width="100" height="34" rx="4" />
  <rect class="vmb" x="610" y="102" width="100" height="34" rx="4" />
  <rect class="vmb" x="740" y="102" width="100" height="34" rx="4" />
  <text x="400" y="120">vCPU 0</text>
  <text class="grey" x="530" y="120">vCPU 1</text>
  <text x="660" y="120">vCPU 2</text>
  <text x="790" y="120">vCPU 3</text>

  <rect class="hv" x="20" y="214" width="860" height="44" rx="6" />
  <text class="violet" x="450" y="236">Hypervisor scheduler <tspan class="small">— with KVM, each vCPU is just a host thread</tspan></text>

  <path class="la" d="M95,138 L95,210" />
  <path class="lb" d="M400,138 L400,210" />
  <path class="lb" d="M660,138 L660,210" />
  <path class="lb" d="M790,138 L790,210" />
  <path class="la" d="M95,260 C95,290 135,295 135,320" />
  <path class="lb" d="M400,260 C400,290 345,295 345,320" />
  <path class="lb" d="M660,260 C660,290 555,295 555,320" />
  <path class="lb" d="M790,260 C790,290 765,295 765,320" />

  <rect class="cpu" x="70" y="324" width="130" height="50" rx="6" />
  <rect class="cpu" x="280" y="324" width="130" height="50" rx="6" />
  <rect class="cpu" x="490" y="324" width="130" height="50" rx="6" />
  <rect class="cpu" x="700" y="324" width="130" height="50" rx="6" />
  <text class="cyan" x="135" y="349">CPU 0</text>
  <text class="cyan" x="345" y="349">CPU 1</text>
  <text class="cyan" x="555" y="349">CPU 2</text>
  <text class="cyan" x="765" y="349">CPU 3</text>
  <text class="small" x="450" y="404">6 vCPUs on 4 physical CPUs: at any moment some run and <tspan class="grey">some wait</tspan> (overcommit)</text>
</svg>
