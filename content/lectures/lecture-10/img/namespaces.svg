<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <title>One sleep process seen from inside its container and from the host: different PID, hostname and network, because of namespaces</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .head { font-size: 20px; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .ctr { fill: rgba(0, 229, 255, 0.08); stroke: #00e5ff; stroke-width: 2; }
    .host { fill: rgba(255, 145, 0, 0.08); stroke: #ff9100; stroke-width: 2; }
    .ns { fill: rgba(118, 255, 3, 0.10); stroke: #76ff03; stroke-width: 2; }
    .shared { fill: rgba(255, 255, 255, 0.03); stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 5 4; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>

  <text class="mono" x="20" y="18"><tspan class="grey">$</tspan> docker run -d --hostname web alpine:3.20 sleep 300</text>

  <!-- inside -->
  <rect class="ctr" x="20" y="44" width="300" height="230" rx="8" />
  <text class="head cyan" x="170" y="68">inside the container</text>
  <text class="small" x="40" y="104" style="text-anchor: start">PID</text>
  <text class="mono" x="130" y="104"><tspan class="cyan">1</tspan>  sleep 300</text>
  <text class="small" x="40" y="150" style="text-anchor: start">hostname</text>
  <text class="mono cyan" x="130" y="150">web</text>
  <text class="small" x="40" y="196" style="text-anchor: start">eth0</text>
  <text class="mono cyan" x="130" y="196">172.17.0.4/16</text>
  <text class="small" x="40" y="242" style="text-anchor: start">processes</text>
  <text class="mono" x="130" y="242">its own only</text>

  <!-- host -->
  <rect class="host" x="580" y="44" width="300" height="230" rx="8" />
  <text class="head orange" x="730" y="68">on the host</text>
  <text class="small" x="600" y="104" style="text-anchor: start">PID</text>
  <text class="mono" x="690" y="104"><tspan class="orange">33457</tspan>  sleep 300</text>
  <text class="small" x="600" y="150" style="text-anchor: start">hostname</text>
  <text class="mono orange" x="690" y="150">docker-desktop</text>
  <text class="small" x="600" y="196" style="text-anchor: start">eth0</text>
  <text class="mono orange" x="690" y="196">192.168.65.3/24</text>
  <text class="small" x="600" y="242" style="text-anchor: start">processes</text>
  <text class="mono" x="690" y="242">all of them</text>

  <!-- middle: the namespaces -->
  <text class="small" x="450" y="60">same process,</text>
  <text class="small" x="450" y="80">new namespaces:</text>
  <rect class="ns" x="350" y="94" width="96" height="30" rx="4" /><text class="mono green" x="372" y="110">pid</text>
  <rect class="ns" x="454" y="94" width="96" height="30" rx="4" /><text class="mono green" x="476" y="110">uts</text>
  <rect class="ns" x="350" y="132" width="96" height="30" rx="4" /><text class="mono green" x="372" y="148">net</text>
  <rect class="ns" x="454" y="132" width="96" height="30" rx="4" /><text class="mono green" x="476" y="148">mnt</text>
  <rect class="ns" x="350" y="170" width="96" height="30" rx="4" /><text class="mono green" x="372" y="186">ipc</text>
  <rect class="ns" x="454" y="170" width="96" height="30" rx="4" /><text class="mono green" x="466" y="186">cgroup</text>
  <rect class="shared" x="350" y="216" width="200" height="30" rx="4" /><text class="mono grey" x="364" y="232">user</text>
  <text class="small" x="500" y="232" style="font-size: 13px">shared</text>
  <text class="small" x="450" y="262" style="font-size: 13px">(Docker's default: no userns)</text>

  <!-- primitives -->
  <rect class="ns" x="20" y="300" width="270" height="110" rx="8" />
  <text class="green" x="155" y="328">namespaces</text>
  <text class="small" x="155" y="356">what a process can <tspan class="green">see</tspan></text>
  <text class="small" x="155" y="380">PIDs, network, mounts, hostname</text>
  <rect class="box" x="315" y="300" width="270" height="110" rx="8" />
  <text class="yellow" x="450" y="328">cgroups</text>
  <text class="small" x="450" y="356">what a process can <tspan class="yellow">use</tspan></text>
  <text class="small" x="450" y="380">CPU, memory, I/O, number of PIDs</text>
  <rect class="box" x="610" y="300" width="270" height="110" rx="8" />
  <text class="violet" x="745" y="328">layered filesystem</text>
  <text class="small" x="745" y="356">what a process <tspan class="violet">runs</tspan></text>
  <text class="small" x="745" y="380">the image, via overlayfs</text>

  <text class="small" x="450" y="446" style="font-size: 13px">Captured with Docker Desktop on macOS: "the host" is its Linux VM. The namespace IDs come from readlink /proc/1/ns/*.</text>
</svg>
