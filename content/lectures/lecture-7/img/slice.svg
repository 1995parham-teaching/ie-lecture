<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <title>Two slices, s := a[1:4] and t := a[3:5], are headers of pointer, length and capacity that share one backing array</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .hot { fill: rgba(255, 145, 0, 0.14); stroke: #ff9100; stroke-width: 2; }
    .cool { fill: rgba(0, 229, 255, 0.10); stroke: #00e5ff; stroke-width: 2; }
    .good { fill: rgba(118, 255, 3, 0.10); stroke: #76ff03; stroke-width: 2; }
    .bad { fill: rgba(255, 82, 82, 0.12); stroke: #ff5252; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .plain { fill: none; stroke: #cfd3da; stroke-width: 2; }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <text class="mono" x="450" y="22" style="font-size: 17px"><tspan class="cyan">a</tspan> := [6]int{10, 20, 30, 40, 50, 60}<tspan dx="28" class="yellow">s</tspan> := a[1:4]<tspan dx="28" class="green">t</tspan> := a[3:5]</text>
  <text class="mono yellow" x="268" y="86" style="font-size: 24px">s</text>
  <rect class="box" x="290" y="66" width="80" height="40" rx="0" />
  <text class="mono" x="330" y="86" style="font-size: 18px">•</text>
  <text class="small" x="330" y="54" style="font-size: 14px">ptr</text>
  <rect class="box" x="370" y="66" width="80" height="40" rx="0" />
  <text class="mono" x="410" y="86" style="font-size: 18px">3</text>
  <text class="small" x="410" y="54" style="font-size: 14px">len</text>
  <rect class="box" x="450" y="66" width="80" height="40" rx="0" />
  <text class="mono" x="490" y="86" style="font-size: 18px">5</text>
  <text class="small" x="490" y="54" style="font-size: 14px">cap</text>
  <path class="line" d="M330.0,106 L330.0,198" />
  <path class="brace" d="M284,158 L284,150 L576,150 L576,158" />
  <text class="start yellow" x="588" y="150" style="font-size: 15px"></text>
  <path class="brace" d="M284,183 L284,175 L776,175 L776,183" />
  <text class="start yellow" x="788" y="175" style="font-size: 15px"></text>
  <text class="start yellow" x="584" y="150" style="font-size: 15px">len(s) = 3</text>
  <text class="start yellow" x="784" y="175" style="font-size: 15px">cap(s) = 5</text>
  <rect class="box" x="180" y="200" width="100" height="60" rx="0" />
  <text class="mono" x="230" y="230" style="font-size: 20px">10</text>
  <rect class="box" x="280" y="200" width="100" height="60" rx="0" />
  <text class="mono" x="330" y="230" style="font-size: 20px">20</text>
  <rect class="box" x="380" y="200" width="100" height="60" rx="0" />
  <text class="mono" x="430" y="230" style="font-size: 20px">30</text>
  <rect class="hot" x="480" y="200" width="100" height="60" rx="0" />
  <text class="mono orange" x="530" y="230" style="font-size: 20px">40</text>
  <rect class="box" x="580" y="200" width="100" height="60" rx="0" />
  <text class="mono" x="630" y="230" style="font-size: 20px">50</text>
  <rect class="box" x="680" y="200" width="100" height="60" rx="0" />
  <text class="mono" x="730" y="230" style="font-size: 20px">60</text>
  <text class="small end" x="164" y="230" style="font-size: 15px">backing array</text>
  <path class="brace" d="M484,282 L484,290 L676,290 L676,282" />
  <text class="start green" x="688" y="290" style="font-size: 15px"></text>
  <path class="brace" d="M484,307 L484,315 L776,315 L776,307" />
  <text class="start green" x="788" y="315" style="font-size: 15px"></text>
  <text class="start green" x="684" y="290" style="font-size: 15px">len(t) = 2</text>
  <text class="start green" x="784" y="315" style="font-size: 15px">cap(t) = 3</text>
  <text class="mono green" x="468" y="380" style="font-size: 24px">t</text>
  <rect class="box" x="490" y="360" width="80" height="40" rx="0" />
  <text class="mono" x="530" y="380" style="font-size: 18px">•</text>
  <text class="small" x="530" y="414" style="font-size: 14px">ptr</text>
  <rect class="box" x="570" y="360" width="80" height="40" rx="0" />
  <text class="mono" x="610" y="380" style="font-size: 18px">2</text>
  <text class="small" x="610" y="414" style="font-size: 14px">len</text>
  <rect class="box" x="650" y="360" width="80" height="40" rx="0" />
  <text class="mono" x="690" y="380" style="font-size: 18px">3</text>
  <text class="small" x="690" y="414" style="font-size: 14px">cap</text>
  <path class="line" d="M530.0,360 L530.0,262" />
  <text class="small end" x="164" y="290" style="font-size: 15px">s[2] and t[0] are</text>
  <text class="small end" x="164" y="312" style="font-size: 15px">the same element</text>
  <path class="line" d="M170,300 C240,300 460.0,290 516.0,266" />
  <text class="small" x="450" y="450" style="font-size: 16px">s[2] = 99 changes a[3], and t[0] reads 99 too: slicing copies the header, never the array</text>
</svg>
