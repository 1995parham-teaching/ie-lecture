<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <title>An interface value is a pair of a dynamic type and a dynamic value; method calls and type assertions both read the type half</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .hot { fill: rgba(255, 145, 0, 0.14); stroke: #ff9100; stroke-width: 2; }
    .cool { fill: rgba(0, 229, 255, 0.10); stroke: #00e5ff; stroke-width: 2; }
    .good { fill: rgba(118, 255, 3, 0.10); stroke: #76ff03; stroke-width: 2; }
    .bad { fill: rgba(255, 82, 82, 0.12); stroke: #ff5252; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .plain { fill: none; stroke: #cfd3da; stroke-width: 2; }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <text class="mono" x="20" y="24" style="text-anchor: start; font-size: 18px">p = s<tspan dx="20" class="grey">// var p Printer;  s := Student{Name: "Linus Torvalds"}</tspan></text>
  <text class="mono cyan" x="40" y="110" style="font-size: 26px">p</text>
  <rect class="cool" x="70" y="70" width="150" height="80" rx="0" />
  <rect class="cool" x="220" y="70" width="150" height="80" rx="0" />
  <text class="small" x="145" y="96" style="font-size: 15px">type</text>
  <text class="mono" x="145" y="124" style="font-size: 20px">•</text>
  <text class="small" x="295" y="96" style="font-size: 15px">value</text>
  <text class="mono" x="295" y="124" style="font-size: 20px">•</text>
  <text class="small" x="220" y="168" style="font-size: 15px">static type: Printer</text>
  <rect class="box" x="30" y="220" width="200" height="96" rx="6" />
  <text class="mono yellow" x="130" y="246" style="font-size: 20px">Student</text>
  <text class="mono small" x="130" y="276" style="font-size: 15px">Print() string</text>
  <text class="mono small" x="130" y="298" style="font-size: 15px">Hello() string</text>
  <path class="line" d="M145,130 L145,216" />
  <text class="small" x="130" y="334" style="font-size: 15px">dynamic type</text>
  <rect class="box" x="260" y="220" width="240" height="96" rx="6" />
  <text class="mono" x="380" y="256" style="font-size: 17px">Student{</text>
  <text class="mono green" x="380" y="282" style="font-size: 15px">Name: "Linus Torvalds"}</text>
  <path class="line" d="M295,130 L340,216" />
  <text class="small" x="380" y="334" style="font-size: 15px">dynamic value (a copy of s)</text>
  <text class="label" x="540" y="76" style="font-size: 15px">decided at run time, by the type half</text>
  <text class="mono start green" x="540" y="108" style="font-size: 17px">p.Print()</text>
  <text class="small start" x="550" y="130" style="font-size: 14px">→ "Linus Torvalds": calls Student's Print</text>
  <text class="mono start green" x="540" y="170" style="font-size: 17px">p.(Student)</text>
  <text class="small start" x="550" y="192" style="font-size: 14px">→ type matches: the Student back</text>
  <text class="mono start yellow" x="540" y="232" style="font-size: 17px">_, ok := p.(Person)</text>
  <text class="small start" x="550" y="254" style="font-size: 14px">→ ok is false, no panic</text>
  <text class="mono start red" x="540" y="294" style="font-size: 17px">p.(Person)</text>
  <text class="small start" x="550" y="316" style="font-size: 14px">→ panic: … is main.Student, not main.Person</text>
  <text class="label" x="540" y="366" style="font-size: 15px">checked at compile time, on the static type</text>
  <text class="mono start red" x="540" y="398" style="font-size: 17px">p.Hello()</text>
  <text class="small start" x="550" y="420" style="font-size: 14px">→ Printer has no method Hello</text>
  <text class="mono start grey" x="30" y="400" style="font-size: 16px">var q Printer  →  (nil, nil), and q == nil is true</text>
  <text class="label" x="30" y="440" style="font-size: 16px">No "implements": having Print() string is enough</text>
</svg>
