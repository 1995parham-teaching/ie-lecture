<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <title>The life of an http.ResponseWriter: the header map is editable until WriteHeader, which fixes the status and a copy of the headers; Write then sends the body. A header set later is dropped, and a Write before WriteHeader means an implicit 200 and a superfluous WriteHeader log line</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .hot { fill: rgba(255, 145, 0, 0.14); stroke: #ff9100; stroke-width: 2; }
    .cool { fill: rgba(0, 229, 255, 0.10); stroke: #00e5ff; stroke-width: 2; }
    .good { fill: rgba(118, 255, 3, 0.10); stroke: #76ff03; stroke-width: 2; }
    .bad { fill: rgba(255, 82, 82, 0.12); stroke: #ff5252; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <!-- the three phases, in the order the handler must call them -->
  <text class="cyan" x="150" y="22">1 · headers: editable</text>
  <text class="orange" x="450" y="22">2 · WriteHeader: commits</text>
  <text class="green" x="750" y="22">3 · Write: the body</text>

  <rect class="cool" x="10" y="42" width="270" height="188" rx="6" />
  <text class="mono start" x="24" y="72" style="font-size: 15px">w.Header().Set(</text>
  <text class="mono start yellow" x="40" y="96" style="font-size: 15px">"Content-Type",</text>
  <text class="mono start yellow" x="40" y="120" style="font-size: 15px">"application/json")</text>
  <text class="small" x="145" y="166">just a map in memory,</text>
  <text class="small" x="145" y="188">change it as often as</text>
  <text class="small" x="145" y="210">you like: nothing is fixed</text>

  <rect class="hot" x="315" y="42" width="270" height="188" rx="6" />
  <text class="mono start" x="329" y="72" style="font-size: 15px">w.WriteHeader(201)</text>
  <text class="mono start orange" x="329" y="106" style="font-size: 15px">HTTP/1.1 201 Created</text>
  <text class="mono start" x="329" y="130" style="font-size: 13px">Content-Type: application/json</text>
  <text class="small" x="450" y="166">the status and a copy</text>
  <text class="small" x="450" y="188">of the headers are fixed;</text>
  <text class="small" x="450" y="210">one final status per response</text>

  <rect class="good" x="620" y="42" width="270" height="188" rx="6" />
  <text class="mono start" x="634" y="72" style="font-size: 15px">w.Write([]byte(`"a"`))</text>
  <text class="mono start" x="634" y="96" style="font-size: 15px">w.Write([]byte(`"b"`))</text>
  <text class="mono start green" x="634" y="130" style="font-size: 15px">"a""b"</text>
  <text class="small" x="755" y="166">body bytes, as many</text>
  <text class="small" x="755" y="188">writes as you need; the server</text>
  <text class="small" x="755" y="210">added Content-Length: 6</text>

  <path class="line" d="M280,136 L313,136" />
  <path class="line" d="M585,136 L618,136" />

  <!-- what goes wrong, both captured with curl -i against a scratch server -->
  <text class="label" x="10" y="270">captured with curl -i (Go 1.27)</text>
  <path class="brace" d="M10,284 L890,284" />

  <rect class="bad" x="10" y="298" width="880" height="64" rx="6" />
  <text class="mono start" x="24" y="318" style="font-size: 15px">WriteHeader(201)  then  w.Header().Set("X-After", "1")</text>
  <text class="start red" x="24" y="344" style="font-size: 16px">X-After is not in the response: the header was already fixed</text>

  <rect class="bad" x="10" y="376" width="880" height="150" rx="6" />
  <text class="mono start" x="24" y="398" style="font-size: 15px">Write(`"Hello"`)  then  Header().Set("Content-Type", …)  then  WriteHeader(418)</text>
  <text class="start" x="24" y="426" style="font-size: 16px">the first Write committed an implicit <tspan class="green">200 OK</tspan>, and the client got</text>
  <text class="mono start yellow" x="40" y="452" style="font-size: 15px">Content-Type: text/plain; charset=utf-8</text>
  <text class="start small" x="410" y="452" style="font-size: 15px">← sniffed from the body; 418 never sent</text>
  <text class="start" x="24" y="480" style="font-size: 16px">and the server logged</text>
  <text class="mono start red" x="24" y="506" style="font-size: 13px">2026/11/16 02:16:20 http: superfluous response.WriteHeader call from main.main.func1 (main.go:14)</text>
</svg>
