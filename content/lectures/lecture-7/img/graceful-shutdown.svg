<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <title>Graceful shutdown, measured: SIGINT at 0.8 s, ListenAndServe returns ErrServerClosed at once, new connections are refused, the in-flight request finishes at 2.3 s and Shutdown returns at 2.4 s</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .hot { fill: rgba(255, 145, 0, 0.14); stroke: #ff9100; stroke-width: 2; }
    .cool { fill: rgba(0, 229, 255, 0.10); stroke: #00e5ff; stroke-width: 2; }
    .good { fill: rgba(118, 255, 3, 0.10); stroke: #76ff03; stroke-width: 2; }
    .bad { fill: rgba(255, 82, 82, 0.12); stroke: #ff5252; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .plain { fill: none; stroke: #cfd3da; stroke-width: 2; }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <text class="end" x="210" y="70" style="font-size: 16px">Ctrl-C</text>
  <text class="mono end" x="210" y="140" style="font-size: 16px">main</text>
  <text class="mono end" x="210" y="210" style="font-size: 16px">ListenAndServe</text>
  <text class="mono end" x="210" y="280" style="font-size: 16px">GET /slow (2 s)</text>
  <text class="end" x="210" y="350" style="font-size: 16px">a new client</text>
  <text class="label" x="20" y="22" style="font-size: 15px">Measured: a handler that sleeps 2 s, and Ctrl-C while it runs</text>
  <path class="plain" d="M230.0,395 L230.0,401" />
  <text class="small" x="230" y="418" style="font-size: 13px">0 s</text>
  <path class="plain" d="M358.0,395 L358.0,401" />
  <text class="small" x="358" y="418" style="font-size: 13px">0.5 s</text>
  <path class="plain" d="M486.0,395 L486.0,401" />
  <text class="small" x="486" y="418" style="font-size: 13px">1 s</text>
  <path class="plain" d="M614.0,395 L614.0,401" />
  <text class="small" x="614" y="418" style="font-size: 13px">1.5 s</text>
  <path class="plain" d="M742.0,395 L742.0,401" />
  <text class="small" x="742" y="418" style="font-size: 13px">2 s</text>
  <path class="plain" d="M870.0,395 L870.0,401" />
  <text class="small" x="870" y="418" style="font-size: 13px">2.5 s</text>
  <path class="plain" d="M230,395 L870,395" />
  <path class="brace" d="M434.8,40 L434.8,385" />
  <text class="mono start red" x="442.8" y="70" style="font-size: 15px">SIGINT</text>
  <rect class="box" x="230" y="126" width="204.8" height="28" rx="4" />
  <text class="mono small" x="332.4" y="140" style="font-size: 14px">&lt;-ctx.Done()</text>
  <rect class="good" x="434.8" y="126" width="409.6" height="28" rx="4" />
  <text class="green" x="639.6" y="140" style="font-size: 14px">srv.Shutdown(ctx) waits for in-flight</text>
  <text class="mono start green" x="850.4" y="140" style="font-size: 14px">nil</text>
  <rect class="cool" x="230" y="196" width="204.8" height="28" rx="4" />
  <text class="cyan" x="332.4" y="210" style="font-size: 14px">serving</text>
  <text class="start" x="442.8" y="210" style="font-size: 15px">returns http.ErrServerClosed at once</text>
  <rect class="hot" x="306.8" y="266" width="512" height="28" rx="4" />
  <text class="orange" x="562.8" y="280" style="font-size: 14px">handler keeps running</text>
  <text class="mono start green" x="824.8" y="280" style="font-size: 14px">200</text>
  <text class="red" x="511.6" y="350" style="font-size: 20px">✕</text>
  <text class="start red" x="527.6" y="350" style="font-size: 15px">connection refused: the listener is closed</text>
</svg>
