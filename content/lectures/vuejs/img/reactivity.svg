<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <title>How a ref change reaches the DOM: track, trigger, queue, re-render</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .head { font-size: 20px; font-weight: bold; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .step { font-size: 15px; fill: #eeeeee; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 16px; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dom { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .panel { fill: none; stroke: #8d97a8; stroke-width: 1.5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2.5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .yellow { fill: #ffcc00; } .violet { fill: #ee82ee; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <!-- ref -->
  <rect class="box" x="330" y="20" width="240" height="100" rx="10" />
  <text class="head green" x="450" y="44">ref</text>
  <text class="mono" x="450" y="72">count</text>
  <text class="small" x="450" y="98">knows who read it</text>

  <!-- your code -->
  <rect class="box" x="640" y="20" width="240" height="100" rx="10" />
  <text class="head yellow" x="760" y="44">your code</text>
  <text class="mono" x="760" y="72">count.value++</text>
  <text class="small" x="760" y="98">e.g. a click handler</text>

  <!-- render -->
  <rect class="box" x="20" y="200" width="240" height="100" rx="10" />
  <text class="head cyan" x="140" y="224">render</text>
  <text class="mono" x="140" y="252">{{ count }}</text>
  <text class="small" x="140" y="278">the compiled template</text>

  <!-- scheduler -->
  <rect class="box" x="640" y="200" width="240" height="100" rx="10" />
  <text class="head violet" x="760" y="224">scheduler</text>
  <text class="mono" x="760" y="252">queue: [render]</text>
  <text class="small" x="760" y="278">a job is queued once</text>

  <!-- DOM -->
  <rect class="dom" x="20" y="370" width="240" height="70" rx="10" />
  <text class="mono" x="140" y="405">&lt;div id="app"&gt;3&lt;/div&gt;</text>

  <!-- arrows -->
  <path class="line" d="M180,200 L340,122" />
  <text class="step" x="200" y="140" style="text-anchor: end"><tspan class="cyan" font-weight="bold">1</tspan> reads .value</text>
  <text class="small" x="200" y="162" style="text-anchor: end">→ track</text>

  <path class="line" d="M640,70 L574,70" />
  <text class="step" x="630" y="142" style="text-anchor: start"><tspan class="yellow" font-weight="bold">2</tspan> writes .value</text>
  <text class="small" x="630" y="164" style="text-anchor: start">→ trigger, queue the render</text>

  <path class="line" d="M520,122 L680,198" />

  <path class="line" d="M640,268 L264,268" />
  <text class="step" x="450" y="250"><tspan class="violet" font-weight="bold">3</tspan> on the next tick, run the job</text>

  <path class="line" d="M140,300 L140,366" />
  <text class="step" x="150" y="334" style="text-anchor: start"><tspan class="cyan" font-weight="bold">4</tspan> patch</text>

  <!-- what was measured -->
  <rect class="panel" x="320" y="330" width="560" height="120" rx="8" />
  <text class="small" x="340" y="352" style="text-anchor: start">three <tspan class="mono yellow">count.value++</tspan> in one handler:</text>
  <text class="small" x="340" y="380" style="text-anchor: start">· right after them, the page still shows <tspan class="mono">0</tspan></text>
  <text class="small" x="340" y="404" style="text-anchor: start">· after <tspan class="mono cyan">await nextTick()</tspan> it shows <tspan class="mono">3</tspan> — rendered once, not three times</text>
  <text class="small" x="340" y="428" style="text-anchor: start">· a ref the template never read causes no render at all</text>
</svg>
