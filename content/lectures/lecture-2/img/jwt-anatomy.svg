<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <title>A JWT is three base64url parts joined by dots: a header, a payload of claims, and a signature over the first two</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 14px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .code { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; text-anchor: start; }
    .tok { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 16px; text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .line { fill: none; stroke: #8d97a8; stroke-width: 1.5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8d97a8" />
    </marker>
  </defs>

  <!-- the token, one piece per <text> so the braces line up -->
  <text class="tok red" x="30" y="34" textLength="346" lengthAdjust="spacingAndGlyphs">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9</text>
  <text class="tok grey" x="380" y="34" textLength="10" lengthAdjust="spacingAndGlyphs">.</text>
  <text class="tok violet" x="394" y="34">eyJzdWIiOiIxMjM0NTY…</text>
  <text class="tok grey" x="590" y="34">.</text>
  <text class="tok cyan" x="606" y="34">gWWHu5Ps_F6lbqJRBX…</text>

  <path class="brace" d="M32,52 v8 h342 v-8 M203,60 v26" />
  <path class="brace" d="M396,52 v8 h190 v-8 M475,60 v26" />
  <path class="brace" d="M608,52 v8 h180 v-8 M698,60 v12 H760 v14" />
  <text class="small" x="203" y="74" style="font-size: 12px; text-anchor: end" dx="-8">base64url</text>
  <text class="small" x="475" y="74" style="font-size: 12px; text-anchor: end" dx="-8">base64url</text>

  <!-- header -->
  <rect class="box" x="20" y="92" width="290" height="132" rx="8" />
  <text class="red" x="165" y="114" style="font-size: 18px">header</text>
  <text class="code" x="40" y="146">{</text>
  <text class="code" x="56" y="168">"alg": <tspan class="yellow">"HS256"</tspan>,</text>
  <text class="code" x="56" y="190">"typ": "JWT"</text>
  <text class="code" x="40" y="210">}</text>

  <!-- payload -->
  <rect class="box" x="330" y="92" width="290" height="176" rx="8" />
  <text class="violet" x="475" y="114" style="font-size: 18px">payload: the claims</text>
  <text class="code" x="346" y="146">{</text>
  <text class="code" x="362" y="168">"sub": "1234567890",</text>
  <text class="code" x="362" y="190">"name": "Parham Alvani",</text>
  <text class="code" x="362" y="212">"iat": 1516239022,</text>
  <text class="code" x="362" y="234">"project": "an awe…"</text>
  <text class="code" x="346" y="254">}</text>

  <!-- signature -->
  <rect class="box" x="640" y="92" width="240" height="176" rx="8" />
  <text class="cyan" x="760" y="114" style="font-size: 18px">signature</text>
  <text class="code" x="656" y="146"><tspan class="yellow">HMAC-SHA256</tspan>(</text>
  <text class="code" x="672" y="168"><tspan class="red">header</tspan> + "." +</text>
  <text class="code" x="672" y="190"><tspan class="violet">payload</tspan>,</text>
  <text class="code" x="672" y="212"><tspan class="orange">secret</tspan></text>
  <text class="code" x="656" y="234">)</text>


  <!-- what it means -->
  <text class="label" x="20" y="304" style="font-size: 17px"><tspan class="red">header</tspan> and <tspan class="violet">payload</tspan> are only <tspan class="yellow">encoded</tspan>, not encrypted: anyone holding the token can read them.</text>
  <text class="label" x="20" y="334" style="font-size: 17px">The <tspan class="cyan">signature</tspan> needs the <tspan class="orange">secret</tspan>: change one character of the payload and it no longer matches,</text>
  <text class="label" x="20" y="358" style="font-size: 17px">so the server can trust the claims without storing anything.</text>

  <text class="label" x="20" y="400" style="font-size: 13px">The sample token from the next slide, decoded in Node. Its signature matches the secret your-256-bit-secret (the jwt.io default).</text>
</svg>
