<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290">
  <title>A forward proxy is a server to the client and a client to the server. The client sends it the whole URL, GET http://example.com/index.html; the proxy sends the origin only the path, GET /index.html, with Host example.com</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .label { font-size: 15px; fill: #b0b4bc; text-anchor: start; }
    .code { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .proxy { fill: rgba(255, 145, 0, 0.06); stroke: #ff9100; stroke-width: 2.5; }
    .half { fill: rgba(255, 255, 255, 0.04); stroke: #8d97a8; stroke-width: 1.5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" /></marker>
  </defs>

  <rect class="box" x="20" y="50" width="130" height="70" rx="8" />
  <text x="85" y="85">Client</text>

  <rect class="proxy" x="270" y="20" width="360" height="130" rx="10" />
  <text class="orange" x="450" y="40">proxy</text>
  <rect class="half" x="285" y="58" width="155" height="78" rx="6" />
  <text x="362" y="85" style="font-size: 18px">acts as a</text>
  <text class="cyan" x="362" y="110" style="font-size: 18px">server</text>
  <rect class="half" x="460" y="58" width="155" height="78" rx="6" />
  <text x="537" y="85" style="font-size: 18px">acts as a</text>
  <text class="green" x="537" y="110" style="font-size: 18px">client</text>

  <rect class="box" x="750" y="50" width="130" height="70" rx="8" />
  <text x="815" y="85">Server</text>

  <path class="line" d="M150,72 H281" />
  <path class="line" d="M285,100 H154" />
  <path class="line" d="M615,72 H746" />
  <path class="line" d="M750,100 H619" />

  <!-- what each side actually sends -->
  <text class="label" x="20" y="186">client → proxy: the whole URL</text>
  <text class="code" x="20" y="214"><tspan class="yellow">GET http://example.com/index.html</tspan> HTTP/1.1</text>
  <text class="code" x="20" y="238">Host: example.com</text>

  <text class="label" x="560" y="186">proxy → server: just the path</text>
  <text class="code" x="560" y="214"><tspan class="yellow">GET /index.html</tspan> HTTP/1.1</text>
  <text class="code" x="560" y="238">Host: example.com</text>

  <text class="small" x="450" y="274">absolute-form and origin-form, RFC 9112 §3.2 (left: what curl -x sends)</text>
</svg>
