<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <title>Two site names resolve to the one address of a reverse proxy, which reads the Host header of each request and passes it to that site's servers</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .hot { fill: rgba(255, 145, 0, 0.12); stroke: #ff9100; stroke-width: 2; }
    .cool { fill: rgba(0, 229, 255, 0.10); stroke: #00e5ff; stroke-width: 2; }
    .good { fill: rgba(118, 255, 3, 0.08); stroke: #76ff03; stroke-width: 2.5; }
    .store { fill: rgba(238, 130, 238, 0.10); stroke: #ee82ee; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <!-- DNS -->
  <rect class="box" x="20" y="10" width="860" height="108" rx="6" />
  <text class="label" x="36" y="32">DNS: two names, one address</text>
  <text class="mono start" xml:space="preserve" x="36" y="60"><tspan class="orange">file.ceit.aut.ac.ir.</tspan>      CNAME  gateway.ceit.aut.ac.ir.</text>
  <text class="mono start" xml:space="preserve" x="36" y="82"><tspan class="cyan">platform.ceit.aut.ac.ir.</tspan>  CNAME  gateway.ceit.aut.ac.ir.</text>
  <text class="mono start" xml:space="preserve" x="36" y="104">gateway.ceit.aut.ac.ir.   A      <tspan class="green">185.211.88.186</tspan></text>
  <text class="small" x="760" y="60">so both browsers</text>
  <text class="small" x="760" y="82">connect to the</text>
  <text class="small" x="760" y="104">same IP and port</text>

  <!-- request for file -->
  <rect class="box" x="20" y="178" width="100" height="44" rx="6" />
  <text x="70" y="200" style="font-size: 18px">browser</text>
  <path class="line" d="M122,200 L146,200" />
  <rect class="box" x="150" y="166" width="270" height="68" rx="6" />
  <text class="mono start" x="164" y="188">GET / HTTP/1.1</text>
  <text class="mono start" x="164" y="212">Host: <tspan class="orange">file.ceit.aut.ac.ir</tspan></text>
  <path class="line" d="M422,200 L446,200" />

  <!-- request for platform -->
  <rect class="box" x="20" y="328" width="100" height="44" rx="6" />
  <text x="70" y="350" style="font-size: 18px">browser</text>
  <path class="line" d="M122,350 L146,350" />
  <rect class="box" x="150" y="316" width="270" height="68" rx="6" />
  <text class="mono start" x="164" y="338">GET / HTTP/1.1</text>
  <text class="mono start" x="164" y="362">Host: <tspan class="cyan">platform.ceit.aut.ac.ir</tspan></text>
  <path class="line" d="M422,350 L446,350" />

  <!-- the gateway -->
  <rect class="good" x="450" y="140" width="160" height="270" rx="8" />
  <text class="green" x="530" y="240">gateway</text>
  <text class="mono" x="530" y="266">185.211.88.186</text>
  <text class="small" x="530" y="296">reverse proxy</text>
  <text class="small" x="530" y="318">e.g. nginx, HAProxy</text>
  <text class="small" x="530" y="164">reads Host,</text>
  <text class="small" x="530" y="184">picks the site</text>

  <!-- the sites -->
  <path class="line" d="M612,192 L696,164" />
  <path class="line" d="M612,206 L696,224" />
  <rect class="hot" x="700" y="142" width="180" height="44" rx="6" />
  <text class="orange" x="790" y="164" style="font-size: 18px">file server 1</text>
  <rect class="hot" x="700" y="202" width="180" height="44" rx="6" />
  <text class="orange" x="790" y="224" style="font-size: 18px">file server 2</text>
  <text class="small" x="790" y="264">taken in turn</text>

  <path class="line" d="M612,350 L696,350" />
  <rect class="cool" x="700" y="328" width="180" height="44" rx="6" />
  <text class="cyan" x="790" y="350" style="font-size: 18px">platform</text>

  <!-- cache -->
  <path class="dash" d="M530,410 L530,428" />
  <path class="store" d="M480,436 L480,476 A50,10 0 0,0 580,476 L580,436" />
  <ellipse class="store" cx="530" cy="436" rx="50" ry="10" />
  <text class="violet" x="530" y="462" style="font-size: 17px">cache</text>
  <text class="label" x="600" y="452">repeats can be answered</text>
  <text class="label" x="600" y="474">without reaching a server</text>

  <!-- the point -->
  <text class="label" x="20" y="430">Same IP, same port: only the Host</text>
  <text class="label" x="20" y="452">header tells the two sites apart.</text>
  <text class="label" x="20" y="474">(For HTTPS, SNI picks the certificate.)</text>
</svg>
