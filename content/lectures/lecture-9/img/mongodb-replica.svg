<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410">
  <title>A MongoDB replica set: one primary takes every write and stores BSON documents in WiredTiger; two secondaries copy its oplog; all members exchange heartbeats every 2 seconds; a write with w majority is acknowledged once 2 of the 3 members have it</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .r { text-anchor: end; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .note { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="impl" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#2b2b2b" stroke="#00e5ff" stroke-width="1.5" />
    </marker>
  </defs>
  <rect class="box" x="20" y="20" width="200" height="56" rx="6" />
  <text x="120" y="48" style="font-size: 18px">application</text>
  <path class="line" d="M222,40 L326,90" />
  <text class="mono small l" x="236" y="30" style="font-size: 13px">insert, w: "majority"</text>
  <path class="line" d="M326,118 L222,68" />
  <text class="small l" x="196" y="116" style="font-size: 14px">ack after 2 of 3</text>

  <rect class="box" x="330" y="64" width="240" height="96" rx="6" style="stroke: #76ff03" />
  <text class="green" x="450" y="90">PRIMARY</text>
  <text class="small" x="450" y="116" style="font-size: 14px">the only member that takes writes</text>
  <text class="mono small" x="450" y="140" style="font-size: 13px">BSON documents · WiredTiger</text>

  <rect class="box" x="40" y="260" width="240" height="70" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="160" y="284">SECONDARY</text>
  <text class="small" x="160" y="310" style="font-size: 14px">copies the oplog</text>
  <rect class="box" x="620" y="260" width="240" height="70" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="740" y="284">SECONDARY</text>
  <text class="small" x="740" y="310" style="font-size: 14px">copies the oplog</text>

  <path class="line" d="M380,162 L200,256" />
  <path class="line" d="M520,162 L700,256" />
  <text class="small r" x="270" y="196" style="font-size: 14px">replication</text>
  <text class="small l" x="630" y="196" style="font-size: 14px">replication</text>

  <path class="dash" d="M282,295 L618,295" />
  <text class="small" x="450" y="280" style="font-size: 14px">heartbeat every 2 s, between all members</text>

  <text x="450" y="364" style="font-size: 16px">Primary lost: the others need a <tspan class="orange">majority</tspan> (2 of 3) to elect a new one;</text>
  <text x="450" y="388" style="font-size: 16px">until then <tspan class="red">no writes</tspan>, so no two primaries can disagree.</text>
</svg>
