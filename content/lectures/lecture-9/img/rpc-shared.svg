<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460">
  <title>Shared resource: System 1 writes order 42 into a shared database and System 2 reads it; they never talk to each other, and the table schema is their contract. RPC: System 1 calls Payment.Charge(42, 50) as if it were local; the client stub marshals the arguments onto the network, the server stub unmarshals them and calls the procedure, and the result "paid order 42: 50" comes back the same way.</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .ret { fill: none; stroke: #cfd3da; stroke-width: 2; stroke-dasharray: 7 4; marker-end: url(#arrow); }
    .bar { fill: rgba(255, 145, 0, 0.25); stroke: #ff9100; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text class="orange" x="450" y="20">Shared resource</text>
  <rect class="box" x="40" y="60" width="170" height="60" rx="6" /><text x="125" y="90">System 1</text>
  <rect class="box" x="690" y="60" width="170" height="60" rx="6" /><text x="775" y="90">System 2</text>
  <path d="M390,62 L390,128 A60,14 0 0 0 510,128 L510,62" style="fill: rgba(255, 145, 0, 0.12); stroke: #ff9100; stroke-width: 2" />
  <ellipse cx="450" cy="62" rx="60" ry="14" style="fill: rgba(255, 145, 0, 0.12); stroke: #ff9100; stroke-width: 2" />
  <text x="450" y="104" style="font-size: 17px">database</text>
  <text class="mono" x="300" y="76" style="font-size: 14px">write order 42</text>
  <path class="line" d="M212,92 L386,92" />
  <text class="mono" x="600" y="76" style="font-size: 14px">read order 42</text>
  <path class="line" d="M514,92 L688,92" />
  <text class="small" x="450" y="172">they never call each other: the table schema is the contract</text>

  <path d="M20,205 L880,205" style="stroke: #555b66; stroke-width: 2" />

  <text class="green" x="450" y="235">Remote procedure call (RPC)</text>
  <rect x="20" y="260" width="300" height="140" rx="8" style="fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5" />
  <text class="small" x="170" y="278" style="font-size: 14px">System 1</text>
  <rect class="box" x="36" y="296" width="120" height="88" rx="6" /><text x="96" y="340" style="font-size: 17px">caller</text>
  <rect class="box" x="184" y="296" width="120" height="88" rx="6" style="stroke: #76ff03" />
  <text class="green" x="244" y="330" style="font-size: 17px">client</text><text class="green" x="244" y="352" style="font-size: 17px">stub</text>
  <rect x="580" y="260" width="300" height="140" rx="8" style="fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5" />
  <text class="small" x="730" y="278" style="font-size: 14px">System 2</text>
  <rect class="box" x="596" y="296" width="120" height="88" rx="6" style="stroke: #76ff03" />
  <text class="green" x="656" y="330" style="font-size: 17px">server</text><text class="green" x="656" y="352" style="font-size: 17px">stub</text>
  <rect class="box" x="744" y="296" width="120" height="88" rx="6" /><text x="804" y="340" style="font-size: 17px">procedure</text>
  <path class="line" d="M158,322 L182,322" /><path class="ret" d="M182,360 L158,360" />
  <path class="line" d="M718,322 L742,322" /><path class="ret" d="M742,360 L718,360" />
  <text class="mono cyan" x="450" y="304" style="font-size: 14px">Payment.Charge {42, 50}</text>
  <path class="line" d="M306,322 L594,322" />
  <path class="ret" d="M594,360 L306,360" />
  <text class="mono yellow" x="450" y="378" style="font-size: 14px">"paid order 42: 50"</text>
  <text class="small" x="450" y="430">looks like a local call; the stubs marshal it over the network</text>
</svg>
