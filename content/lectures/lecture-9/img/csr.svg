<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <title>Client-side rendering: GET / returns an empty shell with a script tag; the browser then fetches /app.js, and the script fetches /api/inbox, which the server answers with JSON from the database. The browser builds the list itself, after three requests.</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .ret { fill: none; stroke: #cfd3da; stroke-width: 2; stroke-dasharray: 7 4; marker-end: url(#arrow); }
    .bar { fill: rgba(255, 145, 0, 0.25); stroke: #ff9100; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="20" y="20" width="180" height="60" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="110" y="42">Browser</text>
  <text class="small" x="110" y="64" style="font-size: 14px">presentation (JS)</text>
  <rect class="box" x="390" y="20" width="220" height="60" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="500" y="42">Server</text>
  <text class="small" x="500" y="64" style="font-size: 14px">business, as a JSON API</text>
  <rect class="box" x="700" y="20" width="180" height="60" rx="6" style="stroke: #ee82ee" />
  <text class="violet" x="790" y="42">Database</text>
  <text class="small" x="790" y="64" style="font-size: 14px">data layer</text>
  <path class="dash" d="M110,80 L110,470" />
  <path class="dash" d="M500,80 L500,470" />
  <path class="dash" d="M790,80 L790,470" />

  <text class="grey" x="40" y="126" style="font-size: 16px">1</text>
  <text class="mono cyan" x="305" y="108">GET /</text>
  <path class="line" d="M112,122 L498,122" />
  <text class="mono" x="305" y="144"><tspan class="green">200</tspan> text/html</text>
  <path class="ret" d="M498,158 L114,158" />
  <text class="mono yellow" x="130" y="182" style="text-anchor: start">&lt;div id="root"&gt;&lt;/div&gt;</text>
  <text class="small red" x="380" y="182" style="font-size: 14px; text-anchor: start">empty</text>

  <text class="grey" x="40" y="236" style="font-size: 16px">2</text>
  <text class="mono cyan" x="305" y="218">GET /app.js</text>
  <path class="line" d="M112,232 L498,232" />
  <text class="mono" x="305" y="254"><tspan class="green">200</tspan> text/javascript</text>
  <path class="ret" d="M498,268 L114,268" />

  <text class="grey" x="40" y="322" style="font-size: 16px">3</text>
  <text class="mono cyan" x="305" y="304">fetch("/api/inbox")</text>
  <path class="line" d="M112,318 L488,318" />
  <rect class="bar" x="490" y="318" width="20" height="68" style="fill: rgba(0, 229, 255, 0.18); stroke: #00e5ff" />
  <text class="mono violet" x="650" y="320" style="font-size: 14px">SELECT mails</text>
  <path class="line" d="M512,334 L788,334" />
  <text class="mono violet" x="650" y="354" style="font-size: 14px">2 rows</text>
  <path class="ret" d="M788,368 L514,368" />
  <text class="mono" x="305" y="374"><tspan class="green">200</tspan> application/json</text>
  <path class="ret" d="M488,390 L114,390" />
  <text class="mono yellow" x="130" y="414" style="text-anchor: start; font-size: 14px">[{"from":"ali","subject":"Exam"}, …]</text>
  <rect class="bar" x="100" y="430" width="20" height="40" />
  <text class="small orange" x="134" y="450" style="font-size: 15px; text-anchor: start">app.js builds the &lt;ul&gt; in the DOM</text>

  <text class="orange" x="450" y="500" style="font-size: 18px">3 requests: the HTML is empty until the JSON arrives</text>
</svg>
