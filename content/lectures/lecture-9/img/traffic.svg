<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <title>North-south traffic crosses the edge between clients and the platform; east-west traffic flows between services inside it</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .bar { fill: rgba(255, 145, 0, 0.25); stroke: #ff9100; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="240" y="16" width="150" height="44" rx="6" /><text x="315" y="38" style="font-size: 16px">web app</text>
  <rect class="box" x="510" y="16" width="150" height="44" rx="6" /><text x="585" y="38" style="font-size: 16px">mobile app</text>
  <path class="line" d="M315,62 L430,130" />
  <path class="line" d="M585,62 L470,130" />

  <rect class="dash" x="60" y="100" width="780" height="300" rx="12" />
  <text class="small l" x="76" y="124" style="font-size: 14px">your platform</text>

  <rect class="box" x="330" y="132" width="240" height="48" rx="6" style="stroke: #ff9100" />
  <text x="450" y="156" style="font-size: 17px">API gateway</text>
  <path class="line" d="M450,182 L450,234" />

  <rect class="box" x="140" y="236" width="140" height="48" rx="6" /><text x="210" y="260" style="font-size: 16px">Users</text>
  <rect class="box" x="380" y="236" width="140" height="48" rx="6" /><text x="450" y="260" style="font-size: 16px">Orders</text>
  <rect class="box" x="620" y="236" width="140" height="48" rx="6" /><text x="690" y="260" style="font-size: 16px">Payment</text>
  <path class="line" d="M378,260 L282,260" style="stroke: #00e5ff" />
  <path class="line" d="M522,260 L618,260" style="stroke: #00e5ff" />
  <path class="line" d="M450,286 C450,330 690,330 690,288" style="stroke: #00e5ff" />

  <text class="orange l" x="610" y="144" style="font-size: 15px">North-South</text>
  <text class="small l" x="610" y="166" style="font-size: 14px">REST · GraphQL · WebSocket</text>
  <text class="cyan" x="450" y="356" style="font-size: 16px">East-West</text>
  <text class="small" x="450" y="378" style="font-size: 14px">HTTP · gRPC · NATS · Kafka</text>
</svg>
