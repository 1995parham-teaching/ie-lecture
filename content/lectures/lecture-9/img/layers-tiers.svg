<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <title>Layers are a logical split of the code; tiers are the machines it runs on. The same three layers can run on one tier or on three.</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .bar { fill: rgba(255, 145, 0, 0.25); stroke: #ff9100; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text x="200" y="24">3 layers on <tspan class="yellow">1 tier</tspan></text>
  <rect class="dash" x="60" y="50" width="280" height="290" rx="10" />
  <text class="small" x="200" y="74" style="font-size: 14px">one server</text>
  <rect class="box" x="90" y="96" width="220" height="62" rx="6" />
  <text class="orange" x="200" y="127">Presentation</text>
  <rect class="box" x="90" y="176" width="220" height="62" rx="6" />
  <text class="green" x="200" y="207">Business logic</text>
  <rect class="box" x="90" y="256" width="220" height="62" rx="6" />
  <text class="cyan" x="200" y="287">Data</text>
  <text class="small" x="200" y="364" style="font-size: 14px">function calls between layers</text>

  <path d="M410,20 L410,380" style="stroke: #555b66; stroke-width: 2" />

  <text x="660" y="24">3 layers on <tspan class="yellow">3 tiers</tspan></text>
  <rect class="dash" x="470" y="66" width="370" height="76" rx="10" />
  <text class="small l" x="484" y="88" style="font-size: 14px; text-anchor: start">browser</text>
  <rect class="box" x="560" y="80" width="260" height="50" rx="6" />
  <text class="orange" x="690" y="105">Presentation <tspan class="small" style="font-size: 14px">HTML, JS</tspan></text>
  <path class="line" d="M690,142 L690,174" />
  <text class="small l" x="700" y="158" style="font-size: 13px; text-anchor: start">network</text>
  <rect class="dash" x="470" y="176" width="370" height="76" rx="10" />
  <text class="small l" x="484" y="198" style="font-size: 14px; text-anchor: start">app server</text>
  <rect class="box" x="560" y="190" width="260" height="50" rx="6" />
  <text class="green" x="690" y="215">Business logic</text>
  <path class="line" d="M690,252 L690,284" />
  <text class="small l" x="700" y="268" style="font-size: 13px; text-anchor: start">network</text>
  <rect class="dash" x="470" y="286" width="370" height="76" rx="10" />
  <text class="small l" x="484" y="308" style="font-size: 14px; text-anchor: start">DB server</text>
  <rect class="box" x="560" y="300" width="260" height="50" rx="6" />
  <text class="cyan" x="690" y="325">Data</text>

  <text class="label" x="20" y="404" style="font-size: 15px">A <tspan class="yellow">layer</tspan> is a logical part of the code; a <tspan class="yellow">tier</tspan> is a physical place where it runs.</text>
</svg>
