<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <title>MVC with every arrow: a click on the view becomes an event passed to the controller; the controller updates the model and may update the view directly; the model signals changes to view and controller; the view queries the model to redraw</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .r { text-anchor: end; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .note { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="impl" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#2b2b2b" stroke="#00e5ff" stroke-width="1.5" />
    </marker>
  </defs>
  <rect class="box" x="360" y="30" width="180" height="56" rx="6" style="stroke: #76ff03" />
  <text class="green" x="450" y="58">Model</text>
  <rect class="box" x="60" y="230" width="180" height="56" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="150" y="258">View</text>
  <rect class="box" x="660" y="230" width="180" height="56" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="750" y="258">Controller</text>
  <circle cx="450" cy="420" r="44" style="fill: rgba(255, 204, 0, 0.12); stroke: #ffcc00; stroke-width: 2" />
  <text x="450" y="410" style="font-size: 17px">event</text>
  <text class="small mono" x="450" y="434" style="font-size: 12px">click Save</text>

  <path class="line" d="M140,228 L366,90" />
  <text class="r" x="236" y="136" style="font-size: 16px">view queries model</text>
  <text class="small r" x="236" y="158" style="font-size: 14px">(reads, never writes)</text>
  <path class="note" d="M404,90 L200,228" />
  <path class="note" d="M496,90 L700,228" />
  <text x="450" y="160" style="font-size: 16px">model signals changes</text>
  <path class="line" d="M760,228 L534,90" />
  <text class="l" x="664" y="136" style="font-size: 16px">controller updates model</text>

  <path class="line" d="M658,258 L244,258" />
  <text x="450" y="242" style="font-size: 16px">controller updates view</text>
  <text class="small" x="450" y="276" style="font-size: 14px">e.g. grey out Save while saving</text>

  <path class="line" d="M150,288 C150,380 300,420 404,420" />
  <text class="small" x="210" y="420" style="font-size: 15px">user clicks</text>
  <path class="line" d="M496,420 C600,420 750,380 750,290" />
  <text class="small l" x="560" y="460" style="font-size: 15px">event is passed to the controller</text>
</svg>
