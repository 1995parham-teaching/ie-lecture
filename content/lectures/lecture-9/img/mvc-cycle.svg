<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <title>MVC as a one-way loop: the user uses the controller, the controller manipulates the model, the model updates the view, and the user sees the view; on the web these are a handler, the database and a template or JSON</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .r { text-anchor: end; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .note { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="impl" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#2b2b2b" stroke="#00e5ff" stroke-width="1.5" />
    </marker>
  </defs>
  <rect class="box" x="350" y="30" width="200" height="60" rx="6" style="stroke: #76ff03" />
  <text class="green" x="450" y="60">Model</text>
  <rect class="box" x="110" y="200" width="200" height="60" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="210" y="230">View</text>
  <rect class="box" x="590" y="200" width="200" height="60" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="690" y="230">Controller</text>
  <circle cx="450" cy="400" r="48" style="fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2" />
  <text x="450" y="400">User</text>

  <path class="line" d="M496,384 L660,264" />
  <text class="l" x="604" y="334" style="font-size: 17px">uses</text>
  <text class="small l mono" x="604" y="358" style="font-size: 13px">POST /students</text>

  <path class="line" d="M690,198 C690,120 640,60 554,60" />
  <text class="l" x="694" y="98" style="font-size: 17px">manipulates</text>
  <text class="small l mono" x="694" y="122" style="font-size: 13px">INSERT a row</text>

  <path class="line" d="M348,60 C260,60 210,120 210,196" />
  <text class="r" x="206" y="98" style="font-size: 17px">updates</text>
  <text class="small r mono" x="206" y="122" style="font-size: 13px">render the list</text>

  <path class="line" d="M240,264 L404,384" />
  <text class="r" x="296" y="334" style="font-size: 17px">sees</text>
  <text class="small r mono" x="296" y="358" style="font-size: 13px">HTML or JSON</text>

  <text class="small" x="450" y="236" style="font-size: 14px">on the web:</text>
  <text class="small" x="450" y="258" style="font-size: 14px">controller = handler</text>
  <text class="small" x="450" y="280" style="font-size: 14px">model = data + rules</text>
  <text class="small" x="450" y="302" style="font-size: 14px">view = template or JSON</text>
</svg>
