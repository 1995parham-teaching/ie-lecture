<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <title>MVC with the controller as mediator: the model and the view never talk; the controller updates model properties and view components and hears back from both</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .r { text-anchor: end; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .note { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="impl" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#2b2b2b" stroke="#00e5ff" stroke-width="1.5" />
    </marker>
  </defs>
  <text class="small" x="450" y="22" style="font-size: 15px">mediator</text>
  <rect class="box" x="350" y="40" width="200" height="64" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="450" y="72">Controller</text>
  <rect class="box" x="60" y="290" width="200" height="64" rx="6" style="stroke: #76ff03" />
  <text class="green" x="160" y="322">Model</text>
  <rect class="box" x="640" y="290" width="200" height="64" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="740" y="322">View</text>

  <path class="line" d="M348,60 L130,60 L130,286" />
  <text class="l" x="144" y="168" style="font-size: 16px">property update</text>
  <text class="small l mono" x="144" y="192" style="font-size: 13px">person.setName("Ada")</text>

  <path class="note" d="M262,322 L400,322 L400,108" />
  <text x="330" y="346" style="font-size: 16px">property change</text>

  <path class="note" d="M638,322 L500,322 L500,108" />
  <text x="570" y="346" style="font-size: 16px">user action</text>

  <path class="line" d="M552,60 L770,60 L770,286" />
  <text class="r" x="756" y="168" style="font-size: 16px">component update</text>
  <text class="small r mono" x="756" y="192" style="font-size: 13px">nameLabel.setText("Ada")</text>

  <text class="small" x="160" y="372" style="font-size: 14px">observed by the controller</text>
  <text class="small" x="740" y="372" style="font-size: 14px">e.g. Java Swing components</text>

  <rect x="20" y="394" width="860" height="44" rx="8" style="fill: rgba(255, 145, 0, 0.08); stroke: #ff9100; stroke-width: 1.5" />
  <text x="450" y="416" style="font-size: 16px">No line between Model and View: every message goes through the controller.</text>
</svg>
