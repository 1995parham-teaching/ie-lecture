<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <title>The four tiers of a microservice application: client, boundary, services and platform</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .bar { fill: rgba(255, 145, 0, 0.25); stroke: #ff9100; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <!-- client -->
  <rect class="box" x="20" y="16" width="860" height="80" rx="8" />
  <text class="cyan l" x="40" y="46">Client</text>
  <text class="small l" x="40" y="72" style="font-size: 13px">uses the application</text>
  <rect class="box" x="330" y="34" width="150" height="44" rx="6" /><text x="405" y="56" style="font-size: 16px">website</text>
  <rect class="box" x="510" y="34" width="150" height="44" rx="6" /><text x="585" y="56" style="font-size: 16px">mobile app</text>
  <rect class="box" x="690" y="34" width="150" height="44" rx="6" /><text x="765" y="56" style="font-size: 16px">partner API</text>

  <path class="line" d="M585,98 L585,118" />
  <!-- boundary -->
  <rect class="box" x="20" y="120" width="860" height="80" rx="8" />
  <text class="orange l" x="40" y="150">Boundary</text>
  <text class="small l" x="40" y="176" style="font-size: 13px">what outsiders may call</text>
  <rect class="box" x="330" y="138" width="510" height="44" rx="6" style="stroke: #ff9100" />
  <text x="585" y="160" style="font-size: 16px">API gateway <tspan class="small" style="font-size: 14px">· auth · routing · aggregation</tspan></text>

  <path class="line" d="M585,202 L585,222" />
  <!-- services -->
  <rect class="box" x="20" y="224" width="860" height="96" rx="8" />
  <text class="green l" x="40" y="254">Services</text>
  <text class="small l" x="40" y="280" style="font-size: 13px">business and technical</text>
  <text class="small l" x="40" y="298" style="font-size: 13px">capabilities</text>
  <rect class="box" x="330" y="248" width="110" height="48" rx="6" /><text x="385" y="272" style="font-size: 16px">Users</text>
  <rect class="box" x="480" y="248" width="110" height="48" rx="6" /><text x="535" y="272" style="font-size: 16px">Orders</text>
  <rect class="box" x="630" y="248" width="110" height="48" rx="6" /><text x="685" y="272" style="font-size: 16px">Payment</text>
  <path class="line" d="M442,272 L478,272" />
  <path class="line" d="M592,272 L628,272" />
  <rect class="box" x="760" y="248" width="80" height="48" rx="6" style="stroke-dasharray: 5 4" /><text class="grey" x="800" y="272" style="font-size: 16px">…</text>

  <!-- platform -->
  <rect x="20" y="336" width="860" height="90" rx="8" style="fill: rgba(238, 130, 238, 0.10); stroke: #ee82ee; stroke-width: 2" />
  <text class="violet l" x="40" y="366">Platform</text>
  <text class="small l" x="40" y="392" style="font-size: 13px">tools every service</text>
  <text class="small l" x="40" y="410" style="font-size: 13px">stands on</text>
  <text class="l" x="330" y="366" style="font-size: 15px">deploy · run · discover · communicate · observe</text>
  <text class="small l" x="330" y="394" style="font-size: 14px">containers, Kubernetes, CI/CD, service discovery,</text>
  <text class="small l" x="330" y="412" style="font-size: 14px">message broker, logs, metrics, tracing</text>
</svg>
