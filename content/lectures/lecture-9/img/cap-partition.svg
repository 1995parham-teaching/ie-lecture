<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <title>CAP during a partition: a write reaches node A but not node B, and a read at B must either fail (consistent) or return the old value (available)</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .bar { fill: rgba(255, 145, 0, 0.25); stroke: #ff9100; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="120" y="110" width="200" height="90" rx="8" />
  <text x="220" y="140">Node A</text>
  <text class="mono" x="220" y="172" style="font-size: 18px">x = <tspan class="green">2</tspan></text>
  <rect class="box" x="580" y="110" width="200" height="90" rx="8" />
  <text x="680" y="140">Node B</text>
  <text class="mono" x="680" y="172" style="font-size: 18px">x = <tspan class="orange">1</tspan></text>

  <path d="M322,155 L420,155" style="stroke: #cfd3da; stroke-width: 2" />
  <path d="M480,155 L578,155" style="stroke: #cfd3da; stroke-width: 2" />
  <path d="M420,155 L432,135 L444,175 L456,135 L468,175 L480,155" style="fill: none; stroke: #ff5252; stroke-width: 3" />
  <text class="red" x="450" y="104" style="font-size: 17px">partition</text>
  <text class="small" x="450" y="206" style="font-size: 13px">replication cannot cross</text>

  <rect class="box" x="140" y="16" width="160" height="40" rx="6" />
  <text x="220" y="36" style="font-size: 16px">client 1</text>
  <path class="line" d="M220,56 L220,108" />
  <text class="mono l" x="232" y="82" style="font-size: 15px">write x = 2</text>

  <rect class="box" x="600" y="16" width="160" height="40" rx="6" />
  <text x="680" y="36" style="font-size: 16px">client 2</text>
  <path class="line" d="M680,56 L680,108" />
  <text class="mono l" x="692" y="82" style="font-size: 15px">read x</text>

  <text x="450" y="252" style="font-size: 18px">What does node B answer?</text>
  <rect class="box" x="60" y="276" width="370" height="140" rx="8" style="stroke: #ff9100" />
  <text class="orange" x="245" y="304">CP: choose Consistency</text>
  <text class="mono red" x="245" y="338" style="font-size: 17px">error / try later</text>
  <text class="small" x="245" y="368" style="font-size: 14px">never returns an old value,</text>
  <text class="small" x="245" y="388" style="font-size: 14px">so it is not available</text>

  <rect class="box" x="470" y="276" width="370" height="140" rx="8" style="stroke: #76ff03" />
  <text class="green" x="655" y="304">AP: choose Availability</text>
  <text class="mono" x="655" y="338" style="font-size: 17px">x = <tspan class="orange">1</tspan> <tspan class="small" style="font-size: 14px">(stale)</tspan></text>
  <text class="small" x="655" y="368" style="font-size: 14px">always answers, so the answer</text>
  <text class="small" x="655" y="388" style="font-size: 14px">may not be the latest write</text>
</svg>
