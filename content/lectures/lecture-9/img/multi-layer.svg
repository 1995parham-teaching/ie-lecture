<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460">
  <title>Three layers of an online shop: presentation (web pages, mobile JSON API, admin panel), business logic (users, orders, payment) and data (SQL database, cache, file storage, message queue); each layer calls only the one below</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .r { text-anchor: end; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .note { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="impl" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#2b2b2b" stroke="#00e5ff" stroke-width="1.5" />
    </marker>
  </defs>
  <rect x="20" y="20" width="860" height="110" rx="8" style="fill: rgba(255, 145, 0, 0.06); stroke: #ff9100; stroke-width: 2" />
  <text class="orange l" x="40" y="62">Presentation</text>
  <text class="small l" x="40" y="90" style="font-size: 14px">input and output</text>
  <rect x="20" y="160" width="860" height="110" rx="8" style="fill: rgba(118, 255, 3, 0.05); stroke: #76ff03; stroke-width: 2" />
  <text class="green l" x="40" y="202">Business logic</text>
  <text class="small l" x="40" y="230" style="font-size: 14px">the rules</text>
  <rect x="20" y="300" width="860" height="110" rx="8" style="fill: rgba(0, 229, 255, 0.05); stroke: #00e5ff; stroke-width: 2" />
  <text class="cyan l" x="40" y="342">Data</text>
  <text class="small l" x="40" y="370" style="font-size: 14px">storage, behind an API</text>
  <rect class="box" x="280" y="50" width="170" height="50" rx="8" style="stroke: #ff9100" /><text x="365" y="75" style="font-size: 16px">web pages</text>
  <rect class="box" x="480" y="50" width="170" height="50" rx="8" style="stroke: #ff9100" /><text x="565" y="75" style="font-size: 16px">mobile JSON API</text>
  <rect class="box" x="680" y="50" width="170" height="50" rx="8" style="stroke: #ff9100" /><text x="765" y="75" style="font-size: 16px">admin panel</text>
  <rect class="box" x="280" y="190" width="170" height="50" rx="8" style="stroke: #76ff03" /><text x="365" y="215" style="font-size: 16px">users</text>
  <rect class="box" x="480" y="190" width="170" height="50" rx="8" style="stroke: #76ff03" /><text x="565" y="215" style="font-size: 16px">orders</text>
  <rect class="box" x="680" y="190" width="170" height="50" rx="8" style="stroke: #76ff03" /><text x="765" y="215" style="font-size: 16px">payment</text>
  <path d="M280,335 v44 a68,10 0 0 0 136,0 v-44" style="fill: rgba(0, 229, 255, 0.08); stroke: #00e5ff; stroke-width: 2" />
  <ellipse cx="348" cy="335" rx="68" ry="10" style="fill: rgba(0, 229, 255, 0.14); stroke: #00e5ff; stroke-width: 2" />
  <text x="348" y="363" style="font-size: 15px">SQL database</text>
  <path d="M428,335 v44 a68,10 0 0 0 136,0 v-44" style="fill: rgba(0, 229, 255, 0.08); stroke: #00e5ff; stroke-width: 2" />
  <ellipse cx="496" cy="335" rx="68" ry="10" style="fill: rgba(0, 229, 255, 0.14); stroke: #00e5ff; stroke-width: 2" />
  <text x="496" y="363" style="font-size: 15px">cache</text>
  <path d="M576,335 v44 a68,10 0 0 0 136,0 v-44" style="fill: rgba(0, 229, 255, 0.08); stroke: #00e5ff; stroke-width: 2" />
  <ellipse cx="644" cy="335" rx="68" ry="10" style="fill: rgba(0, 229, 255, 0.14); stroke: #00e5ff; stroke-width: 2" />
  <text x="644" y="363" style="font-size: 15px">file storage</text>
  <path d="M724,335 v44 a73,10 0 0 0 146,0 v-44" style="fill: rgba(0, 229, 255, 0.08); stroke: #00e5ff; stroke-width: 2" />
  <ellipse cx="797" cy="335" rx="73" ry="10" style="fill: rgba(0, 229, 255, 0.14); stroke: #00e5ff; stroke-width: 2" />
  <text x="797" y="363" style="font-size: 15px">message queue</text>
  <path class="line" d="M232,104 L232,186" />
  <path class="line" d="M252,186 L252,104" />
  <path class="line" d="M232,244 L232,326" />
  <path class="line" d="M252,326 L252,244" />
  <text class="small" x="450" y="440" style="font-size: 15px">Example: an online shop. Calls go down one layer at a time; results come back up.</text>
</svg>
