<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <title>Classic MVC: the user acts on the view, the view passes the call to the controller, the controller manipulates the model, and the model fires a change event that the view observes</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .r { text-anchor: end; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .note { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="impl" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#2b2b2b" stroke="#00e5ff" stroke-width="1.5" />
    </marker>
  </defs>
  <text x="450" y="26" style="font-size: 18px">user interaction</text>
  <path class="line" d="M450,44 L450,106" />
  <text class="yellow l" x="466" y="76" style="font-size: 16px">1</text>
  <text class="small l" x="486" y="76" style="font-size: 15px">types 5 into cell B2</text>

  <rect class="box" x="360" y="110" width="180" height="56" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="450" y="138">View</text>
  <rect class="box" x="80" y="320" width="200" height="56" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="180" y="348">Controller</text>
  <rect class="box" x="620" y="320" width="200" height="56" rx="6" style="stroke: #76ff03" />
  <text class="green" x="720" y="348">Model</text>

  <path class="line" d="M358,140 C220,140 180,200 180,316" />
  <text x="100" y="180" style="font-size: 17px">passes calls to</text>
  <text class="yellow l" x="40" y="212" style="font-size: 16px">2</text>
  <text class="small l" x="60" y="212" style="font-size: 15px">"cell B2 edited: 5"</text>

  <path class="line" d="M282,348 L616,348" />
  <text x="450" y="330" style="font-size: 17px">manipulates</text>
  <text class="small" x="450" y="372" style="font-size: 15px"><tspan class="yellow">3</tspan>  set B2 = 5, recompute C1 = B2 * 2</text>

  <path class="note" d="M720,318 C720,200 680,140 544,140" />
  <text x="800" y="180" style="font-size: 17px">fires events on</text>
  <text class="yellow l" x="740" y="212" style="font-size: 16px">4</text>
  <text class="small l" x="760" y="212" style="font-size: 15px">"B2, C1 changed"</text>

  <rect x="20" y="410" width="860" height="76" rx="8" style="fill: rgba(255, 255, 255, 0.04); stroke: #8d97a8; stroke-width: 1.5" />
  <text class="l" x="40" y="434" style="font-size: 16px">In Excel: the grid redraws B2 and C1 because it <tspan class="orange">observes</tspan> the model.</text>
  <text class="small l" x="40" y="462" style="font-size: 15px">The model never calls the view by name; it only announces "I changed" (dashed = event).</text>
</svg>
