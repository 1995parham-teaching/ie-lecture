<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <title>Server-side rendering: the browser sends GET /, the server queries the database, fills an HTML template and answers with HTML that already contains the list. One request, and the page can be shown at once.</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .ret { fill: none; stroke: #cfd3da; stroke-width: 2; stroke-dasharray: 7 4; marker-end: url(#arrow); }
    .bar { fill: rgba(255, 145, 0, 0.25); stroke: #ff9100; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="20" y="20" width="180" height="60" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="110" y="42">Browser</text>
  <text class="small" x="110" y="64" style="font-size: 14px">only displays</text>
  <rect class="box" x="390" y="20" width="220" height="60" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="500" y="42">Server</text>
  <text class="small" x="500" y="64" style="font-size: 14px">presentation + business</text>
  <rect class="box" x="700" y="20" width="180" height="60" rx="6" style="stroke: #ee82ee" />
  <text class="violet" x="790" y="42">Database</text>
  <text class="small" x="790" y="64" style="font-size: 14px">data layer</text>
  <path class="dash" d="M110,80 L110,330" />
  <path class="dash" d="M500,80 L500,330" />
  <path class="dash" d="M790,80 L790,330" />

  <text class="mono cyan" x="305" y="112">GET /</text>
  <path class="line" d="M112,126 L488,126" />
  <rect class="bar" x="490" y="126" width="20" height="132" />
  <text class="mono violet" x="650" y="140" style="font-size: 14px">SELECT mails</text>
  <path class="line" d="M512,154 L788,154" />
  <text class="mono violet" x="650" y="176" style="font-size: 14px">2 rows</text>
  <path class="ret" d="M788,190 L514,190" />
  <text class="small orange" x="650" y="226" style="font-size: 15px">fills the HTML template</text>

  <text class="mono" x="305" y="240"><tspan class="green">200</tspan> text/html</text>
  <path class="ret" d="M488,256 L114,256" />
  <text class="mono yellow" x="140" y="282" style="text-anchor: start">&lt;ul&gt;</text>
  <text class="mono yellow" x="160" y="302" style="text-anchor: start">&lt;li&gt;ali: Exam&lt;/li&gt;</text>
  <text class="mono yellow" x="160" y="322" style="text-anchor: start">&lt;li&gt;sara: Project&lt;/li&gt;</text>
  <text class="mono yellow" x="140" y="342" style="text-anchor: start">&lt;/ul&gt;</text>

  <text class="green" x="450" y="380" style="font-size: 18px">1 request: the data is already in the HTML</text>
</svg>
