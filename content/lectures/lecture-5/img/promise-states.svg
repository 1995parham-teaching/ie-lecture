<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476">
  <title>The states of a promise and how then and catch chain</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <rect class="box" x="30" y="185" width="160" height="60" rx="8" />
  <text class="yellow" x="110" y="215">pending</text>

  <rect class="dash" x="270" y="30" width="200" height="370" rx="10" />
  <text class="small" x="370" y="203">settled</text>
  <text class="small" x="370" y="227" style="font-size: 14px">never changes again</text>

  <rect class="box" x="290" y="60" width="160" height="60" rx="8" />
  <text class="green" x="370" y="90">fulfilled</text>
  <rect class="box" x="290" y="310" width="160" height="60" rx="8" />
  <text class="red" x="370" y="340">rejected</text>

  <path class="line" d="M150,183 L288,100" />
  <text class="mono small" x="170" y="118" style="font-size: 15px">resolve(value)</text>
  <path class="line" d="M150,247 L288,330" />
  <text class="mono small" x="170" y="310" style="font-size: 15px">reject(reason)</text>
  <text class="small" x="170" y="332" style="font-size: 14px">or throw</text>

  <rect class="box" x="530" y="60" width="200" height="60" rx="8" />
  <text class="mono" x="630" y="90" style="font-size: 16px">.then(onFulfilled)</text>
  <rect class="box" x="530" y="310" width="200" height="60" rx="8" />
  <text class="mono" x="630" y="340" style="font-size: 16px">.catch(onRejected)</text>
  <path class="line" d="M452,90 H526" />
  <path class="line" d="M452,340 H526" />

  <rect class="box" x="760" y="185" width="120" height="60" rx="8" />
  <text class="small" x="820" y="204" style="font-size: 14px">a new</text>
  <text class="yellow" x="820" y="226" style="font-size: 18px">pending</text>
  <path class="line" d="M680,122 L790,183" />
  <path class="line" d="M680,308 L790,247" />

  <text class="small" x="450" y="432" style="font-size: 16px">Every <tspan class="mono">.then</tspan> and <tspan class="mono">.catch</tspan> returns a new promise, which is what makes a chain:</text>
  <text class="small" x="450" y="456" style="font-size: 16px">the handler returns <tspan class="mono green">v</tspan> → fulfilled with <tspan class="mono green">v</tspan>; the handler throws <tspan class="mono red">e</tspan> → rejected with <tspan class="mono red">e</tspan></text>
</svg>
