<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <title>The event loop: call stack, heap, Web APIs, the task queue and the microtask queue</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <!-- row 1: heap, call stack, web APIs -->
  <text x="130" y="30">Heap</text>
  <rect class="dash" x="30" y="50" width="200" height="180" rx="8" />
  <circle cx="80" cy="95" r="14" class="box" />
  <circle cx="170" cy="85" r="14" class="box" />
  <circle cx="120" cy="160" r="14" class="box" />
  <circle cx="190" cy="185" r="14" class="box" />
  <path d="M94,99 L106,150 M184,90 L188,171 M134,163 L176,180" style="stroke:#8d97a8;stroke-width:2" />
  <text class="small" x="130" y="212" style="font-size: 14px">objects live here</text>

  <text x="380" y="30">Call stack</text>
  <rect class="box" x="280" y="50" width="200" height="180" rx="8" />
  <rect class="box" x="300" y="174" width="160" height="40" rx="5" />
  <text class="mono" x="380" y="194" style="font-size: 17px">script</text>
  <rect class="box" x="300" y="128" width="160" height="40" rx="5" />
  <text class="mono" x="380" y="148" style="font-size: 17px">f()</text>
  <rect class="box" x="300" y="82" width="160" height="40" rx="5" />
  <text class="mono" x="380" y="102" style="font-size: 17px">g()</text>

  <text x="745" y="30">Web APIs <tspan class="small">(the browser)</tspan></text>
  <rect class="box" x="620" y="50" width="250" height="180" rx="8" />
  <text class="mono cyan" x="745" y="90" style="font-size: 17px">setTimeout</text>
  <text class="mono cyan" x="745" y="130" style="font-size: 17px">fetch</text>
  <text class="mono cyan" x="745" y="170" style="font-size: 17px">addEventListener</text>
  <text class="small" x="745" y="208" style="font-size: 14px">wait outside JavaScript</text>

  <path class="line" d="M482,110 H616" />
  <text class="small" x="550" y="94" style="font-size: 14px">calls</text>
  <path class="line" d="M745,232 V276" />
  <text class="small" x="735" y="254" style="font-size: 14px; text-anchor: end">timer fires, click, I/O done</text>

  <!-- queues -->
  <text class="label" x="290" y="266">Task queue</text>
  <rect class="box" x="280" y="280" width="590" height="54" rx="8" />
  <rect class="box" x="292" y="289" width="90" height="36" rx="5" /><text class="mono orange" x="337" y="308" style="font-size: 17px">cb</text>
  <rect class="box" x="392" y="289" width="90" height="36" rx="5" /><text class="mono orange" x="437" y="308" style="font-size: 17px">cb1</text>
  <rect class="box" x="492" y="289" width="110" height="36" rx="5" /><text class="mono orange" x="547" y="308" style="font-size: 17px">onclick</text>
  <text class="small" x="740" y="308" style="font-size: 14px">← the next to run is on the left</text>

  <text class="label" x="290" y="366">Microtask queue</text>
  <rect class="box" x="280" y="380" width="590" height="54" rx="8" />
  <rect class="box" x="292" y="389" width="130" height="36" rx="5" /><text class="mono green" x="357" y="408" style="font-size: 17px">.then(…)</text>
  <rect class="box" x="432" y="389" width="130" height="36" rx="5" /><text class="mono green" x="497" y="408" style="font-size: 17px">await …</text>
  <text class="small" x="718" y="408" style="font-size: 14px">promise settled, queueMicrotask</text>

  <!-- event loop -->
  <circle cx="130" cy="350" r="56" style="fill:none;stroke:#ffcc00;stroke-width:2.5" />
  <text class="yellow" x="130" y="340" style="font-size: 18px">event</text>
  <text class="yellow" x="130" y="362" style="font-size: 18px">loop</text>
  <path class="line" d="M278,307 L189,334" />
  <path class="line" d="M278,407 L186,370" />
  <path class="line" d="M162,304 L298,234" />

  <!-- steps -->
  <text class="label" x="30" y="470"><tspan class="yellow">1</tspan>  take the oldest task and run it until the call stack is empty</text>
  <text class="label" x="30" y="496"><tspan class="yellow">2</tspan>  run every microtask, including the ones queued while doing this</text>
  <text class="label" x="30" y="522"><tspan class="yellow">3</tspan>  render the page if needed, then go back to 1</text>
</svg>
