<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <title>How reduce works: [5, 10, 20].reduce((sum, x) => sum + x, 0)</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text class="mono" x="450" y="30" style="font-size: 18px">[5, 10, 20].reduce((sum, x) =&gt; sum + x, <tspan class="violet">0</tspan>)</text>
  <rect class="box" x="295" y="70" width="70" height="44" rx="5" />
  <text class="mono cyan" x="330" y="92">5</text>
  <text class="small" x="330" y="58" style="font-size: 13px">x = a[0]</text>
  <path class="line" d="M330,116 V176" />
  <rect class="box" x="495" y="70" width="70" height="44" rx="5" />
  <text class="mono cyan" x="530" y="92">10</text>
  <text class="small" x="530" y="58" style="font-size: 13px">x = a[1]</text>
  <path class="line" d="M530,116 V176" />
  <rect class="box" x="695" y="70" width="70" height="44" rx="5" />
  <text class="mono cyan" x="730" y="92">20</text>
  <text class="small" x="730" y="58" style="font-size: 13px">x = a[2]</text>
  <path class="line" d="M730,116 V176" />
  <text class="label" x="30" y="92">the array</text>
  <text class="label" x="30" y="160">initial value</text>
  <rect class="box" x="70" y="180" width="80" height="60" rx="8" style="stroke:#ee82ee" />
  <text class="mono violet" x="110" y="210" style="font-size: 22px">0</text>
  <path class="line" d="M152,210 H248" />
  <rect class="box" x="250" y="180" width="160" height="60" rx="8" />
  <text class="mono" x="330" y="201" style="font-size: 15px"><tspan class="yellow">0</tspan> + <tspan class="cyan">5</tspan></text>
  <text class="small" x="330" y="224" style="font-size: 13px">call 1</text>
  <text class="mono yellow" x="430" y="196" style="font-size: 15px">5</text>
  <path class="line" d="M412,210 H448" />
  <rect class="box" x="450" y="180" width="160" height="60" rx="8" />
  <text class="mono" x="530" y="201" style="font-size: 15px"><tspan class="yellow">5</tspan> + <tspan class="cyan">10</tspan></text>
  <text class="small" x="530" y="224" style="font-size: 13px">call 2</text>
  <text class="mono yellow" x="630" y="196" style="font-size: 15px">15</text>
  <path class="line" d="M612,210 H648" />
  <rect class="box" x="650" y="180" width="160" height="60" rx="8" />
  <text class="mono" x="730" y="201" style="font-size: 15px"><tspan class="yellow">15</tspan> + <tspan class="cyan">20</tspan></text>
  <text class="small" x="730" y="224" style="font-size: 13px">call 3</text>
  <text class="mono yellow" x="830" y="196" style="font-size: 15px">35</text>
  <path class="line" d="M812,210 H832 V290" />
  <text class="mono yellow" x="832" y="312" style="font-size: 24px">35</text>
  <text class="small" x="832" y="340" style="font-size: 14px">the result</text>
  <text class="small start" x="30" y="300" style="font-size: 16px">Each call gets the <tspan class="yellow">sum so far</tspan> and the next <tspan class="cyan">element</tspan>.</text>
  <text class="small start" x="30" y="326" style="font-size: 16px">What the callback returns becomes the sum for the next call.</text>
  <text class="small start" x="30" y="352" style="font-size: 16px">After the last element, reduce returns it.</text>
</svg>
