<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430">
  <title>One turn of the event loop: one task, every microtask, then render</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="30" y="90" width="240" height="120" rx="10" />
  <text class="yellow" x="150" y="122" style="font-size: 19px">1  Run one task</text>
  <text class="small" x="150" y="158" style="font-size: 15px">the oldest in the task queue,</text>
  <text class="small" x="150" y="182" style="font-size: 15px">until the call stack is empty</text>
  <rect class="box" x="330" y="90" width="240" height="120" rx="10" />
  <text class="green" x="450" y="122" style="font-size: 19px">2  Run all microtasks</text>
  <text class="small" x="450" y="158" style="font-size: 15px">also the ones queued</text>
  <text class="small" x="450" y="182" style="font-size: 15px">while they run</text>
  <rect class="box" x="630" y="90" width="240" height="120" rx="10" />
  <text class="cyan" x="750" y="122" style="font-size: 19px">3  Render, if a frame is due</text>
  <text class="small" x="750" y="158" style="font-size: 15px">requestAnimationFrame,</text>
  <text class="small" x="750" y="182" style="font-size: 15px">style, layout, paint</text>
  <path class="line" d="M272,150 H326" />
  <path class="line" d="M572,150 H626" />
  <path class="line" d="M420,88 C420,40 520,40 520,86" />
  <text class="small" x="470" y="30" style="font-size: 14px">queue not empty: run the next one</text>
  <path class="line" d="M750,212 V262 H150 V214" />
  <text class="small" x="450" y="282" style="font-size: 15px">repeat; if the task queue is empty, wait for a task</text>
  <text class="small start" x="30" y="330" style="font-size: 16px">A frame is due about every <tspan class="yellow">16.7 ms</tspan> on a 60 Hz screen. The browser cannot render</text>
  <text class="small start" x="30" y="356" style="font-size: 16px">in the middle of step 1 or step 2, so a task longer than <tspan class="red">50 ms</tspan> (a "long task")</text>
  <text class="small start" x="30" y="382" style="font-size: 16px">makes the page stutter, and endless microtasks freeze it.</text>
</svg>
