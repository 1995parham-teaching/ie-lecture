<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <title>A page from domain-a.com can always read its own origin; it can read domain-b.com only when the response grants it</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .bar { fill: rgba(255, 145, 0, 0.25); stroke: #ff9100; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="dash" x="20" y="30" width="330" height="360" rx="10" />
  <text class="small" x="185" y="56">Browser</text>
  <rect class="box" x="50" y="80" width="270" height="280" rx="6" />
  <text x="185" y="110" style="font-size: 18px">page from</text>
  <text class="mono orange" x="185" y="136" style="font-size: 17px">https://domain-a.com</text>
  <rect class="box" x="80" y="176" width="210" height="150" rx="6" />
  <text class="mono" x="185" y="206" style="font-size: 16px">fetch(…)</text>
  <text class="small" x="185" y="236" style="font-size: 14px">it runs with the</text>
  <text class="small" x="185" y="256" style="font-size: 14px">origin of the page,</text>
  <text class="small" x="185" y="276" style="font-size: 14px">not of the .js file</text>

  <rect class="box" x="620" y="60" width="260" height="90" rx="6" />
  <text x="750" y="92" style="font-size: 18px">Web server</text>
  <text class="mono orange" x="750" y="120" style="font-size: 17px">domain-a.com</text>
  <rect class="box" x="620" y="260" width="260" height="90" rx="6" />
  <text x="750" y="292" style="font-size: 18px">Web server</text>
  <text class="mono cyan" x="750" y="320" style="font-size: 17px">domain-b.com</text>

  <path class="line" d="M292,210 L340,210 L340,105 L618,105" />
  <text class="mono l" x="370" y="86" style="font-size: 15px">GET /data.json</text>
  <text class="green l" x="370" y="134" style="font-size: 17px">same-origin</text>
  <text class="small l" x="370" y="156" style="font-size: 14px">always readable</text>

  <path class="line" d="M292,292 L340,292 L340,305 L618,305" />
  <text class="mono l" x="370" y="276" style="font-size: 15px">GET /data.json</text>
  <text class="red l" x="370" y="340" style="font-size: 17px">cross-origin</text>
  <text class="small l" x="370" y="362" style="font-size: 14px">readable only if the response carries</text>
  <text class="mono green l" x="370" y="384" style="font-size: 14px">Access-Control-Allow-Origin</text>
</svg>
