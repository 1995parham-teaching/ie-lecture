<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <title>A simple cross-origin GET: the browser adds Origin, the server answers with Access-Control-Allow-Origin, and the browser hands the response to the script</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .bar { fill: rgba(255, 145, 0, 0.25); stroke: #ff9100; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="30" y="16" width="240" height="56" rx="6" />
  <text x="150" y="36" style="font-size: 18px">Browser</text>
  <text class="mono orange" x="150" y="58" style="font-size: 14px">page: https://foo.example</text>
  <rect class="box" x="640" y="16" width="220" height="56" rx="6" />
  <text x="750" y="36" style="font-size: 18px">Server</text>
  <text class="mono cyan" x="750" y="58" style="font-size: 14px">https://bar.other</text>
  <path class="dash" d="M150,72 L150,290" />
  <path class="dash" d="M750,72 L750,290" />

  <text class="mono l" x="170" y="112">GET /resources/public-data/ HTTP/1.1</text>
  <text class="mono l" x="170" y="136"><tspan class="orange">Origin: https://foo.example</tspan></text>
  <text class="label" x="170" y="160" style="font-size: 13px">added by the browser, not by your code</text>
  <path class="line" d="M152,180 L748,180" />

  <text class="mono" x="730" y="224" style="text-anchor: end">HTTP/1.1 200 OK</text>
  <text class="mono" x="730" y="248" style="text-anchor: end"><tspan class="green">Access-Control-Allow-Origin: *</tspan></text>
  <path class="line" d="M748,270 L152,270" />

  <text class="green l" x="170" y="312" style="font-size: 17px">✓ the header allows any origin</text>
  <text class="label" x="170" y="336">so the browser hands the response to the script</text>
  <text class="label" x="560" y="368" style="font-size: 13px">Only the CORS headers are shown.</text>
</svg>
