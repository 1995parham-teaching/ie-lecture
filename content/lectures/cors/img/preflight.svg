<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560">
  <title>A preflighted request: an OPTIONS request asks permission for PUT with a JSON body, the server grants it, then the browser sends the real PUT</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; }
    .l { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .bar { fill: rgba(255, 145, 0, 0.25); stroke: #ff9100; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="100" y="12" width="240" height="56" rx="6" />
  <text x="220" y="32" style="font-size: 18px">Browser</text>
  <text class="mono orange" x="220" y="54" style="font-size: 13px">page: http://localhost:8081</text>
  <rect class="box" x="710" y="12" width="220" height="56" rx="6" />
  <text x="820" y="32" style="font-size: 18px">Server</text>
  <text class="mono cyan" x="820" y="54" style="font-size: 13px">http://localhost:8082</text>
  <path class="dash" d="M220,68 L220,78 M220,106 L220,530" />
  <path class="dash" d="M820,68 L820,78 M820,106 L820,530" />

  <text class="mono l" x="20" y="92" style="font-size: 13px">fetch(url, { method: <tspan class="yellow">"PUT"</tspan>, headers: { <tspan class="yellow">"Content-Type": "application/json"</tspan> }, body })</text>

  <!-- left-hand brackets -->
  <path class="brace" d="M110,118 L100,118 L100,322 L110,322" />
  <text class="violet" x="52" y="210" style="font-size: 17px">preflight</text>
  <text class="small" x="52" y="234" style="font-size: 13px">sent by the</text>
  <text class="small" x="52" y="252" style="font-size: 13px">browser alone</text>
  <path class="brace" d="M110,350 L100,350 L100,516 L110,516" />
  <text class="green" x="52" y="424" style="font-size: 17px">the real</text>
  <text class="green" x="52" y="446" style="font-size: 17px">request</text>

  <text class="mono l" x="240" y="122"><tspan class="violet">OPTIONS</tspan> /data.json</text>
  <text class="mono l" x="240" y="144">Origin: http://localhost:8081</text>
  <text class="mono l" x="240" y="166">Access-Control-Request-Method: <tspan class="yellow">PUT</tspan></text>
  <text class="mono l" x="240" y="188">Access-Control-Request-Headers: <tspan class="yellow">content-type</tspan></text>
  <path class="line" d="M222,206 L818,206" />

  <text class="mono" x="800" y="232" style="text-anchor: end">HTTP/1.1 204 No Content</text>
  <text class="mono" x="800" y="254" style="text-anchor: end">Access-Control-Allow-Origin: <tspan class="green">http://localhost:8081</tspan></text>
  <text class="mono" x="800" y="276" style="text-anchor: end">Access-Control-Allow-Methods: <tspan class="green">GET, PUT</tspan></text>
  <text class="mono" x="800" y="298" style="text-anchor: end">Access-Control-Allow-Headers: <tspan class="green">Content-Type</tspan></text>
  <text class="mono" x="800" y="320" style="text-anchor: end">Access-Control-Max-Age: 600 <tspan class="grey">(seconds to cache this answer)</tspan></text>
  <path class="line" d="M818,338 L222,338" />

  <text class="mono l" x="240" y="368"><tspan class="yellow">PUT</tspan> /data.json</text>
  <text class="mono l" x="240" y="390">Origin: http://localhost:8081</text>
  <text class="mono l" x="240" y="412"><tspan class="yellow">Content-Type: application/json</tspan></text>
  <path class="line" d="M222,430 L818,430" />

  <text class="mono" x="800" y="458" style="text-anchor: end">HTTP/1.1 200 OK</text>
  <text class="mono" x="800" y="480" style="text-anchor: end">Access-Control-Allow-Origin: <tspan class="green">http://localhost:8081</tspan></text>
  <path class="line" d="M818,500 L222,500" />

  <text class="label" x="240" y="546" style="font-size: 13px">Captured from headless Chrome against a local server; headers not about CORS are left out.</text>
</svg>
