<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <title>From addTwoNum.wat to a number on the page</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .lane { font-size: 16px; fill: #b0b4bc; text-anchor: start; font-weight: bold; }
    .small { font-size: 14px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 16px; }
    .big { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 26px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .tool { fill: rgba(0, 229, 255, 0.08); stroke: #00e5ff; stroke-width: 2; }
    .panel { fill: none; stroke: #8d97a8; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .yellow { fill: #ffcc00; } .violet { fill: #ee82ee; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <!-- build time -->
  <rect class="panel" x="10" y="10" width="880" height="130" rx="10" />
  <text class="lane" x="26" y="32">ahead of time, on your machine</text>

  <rect class="box" x="40" y="54" width="220" height="66" rx="6" />
  <text class="mono yellow" x="150" y="78">addTwoNum.wat</text>
  <text class="small" x="150" y="102">text, for people</text>

  <path class="line" d="M260,87 L338,87" />
  <rect class="tool" x="340" y="54" width="200" height="66" rx="6" />
  <text class="mono cyan" x="440" y="78">wat2wasm</text>
  <text class="small" x="440" y="102">from wabt</text>

  <path class="line" d="M540,87 L618,87" />
  <rect class="box" x="620" y="54" width="240" height="66" rx="6" />
  <text class="mono orange" x="740" y="78">addTwoNum.wasm</text>
  <text class="small" x="740" y="102">binary, 41 bytes</text>

  <!-- run time -->
  <rect class="panel" x="10" y="166" width="880" height="274" rx="10" />
  <text class="lane" x="874" y="188" style="text-anchor: end">at run time, in the browser (hello-WebAssembly.js)</text>

  <path class="line" d="M740,120 L740,153 L135,153 L135,208" />

  <rect class="box" x="40" y="210" width="190" height="56" rx="6" />
  <text class="mono" x="135" y="238"><tspan class="cyan">fetch</tspan>(url)</text>

  <path class="line" d="M230,238 L268,238" />
  <rect class="box" x="270" y="210" width="260" height="56" rx="6" />
  <text class="mono" x="400" y="238">response.<tspan class="cyan">arrayBuffer</tspan>()</text>

  <path class="line" d="M530,238 L568,238" />
  <rect class="box" x="570" y="210" width="310" height="56" rx="6" />
  <text class="mono" x="725" y="238">WebAssembly.<tspan class="cyan">instantiate</tspan>(bytes)</text>
  <text class="small" x="725" y="286">decode · validate · compile · instantiate</text>

  <path class="line" d="M725,296 L725,318 L170,318 L170,346" />

  <rect class="box" x="40" y="348" width="260" height="56" rx="6" />
  <text class="mono" x="170" y="376">{ module, <tspan class="green">instance</tspan> }</text>

  <path class="line" d="M300,376 L338,376" />
  <rect class="box" x="340" y="348" width="340" height="56" rx="6" />
  <text class="mono" x="510" y="376"><tspan class="green">instance</tspan>.exports.<tspan class="orange">add</tspan>(14, 5)</text>

  <path class="line" d="M680,376 L738,376" />
  <rect class="box" x="740" y="348" width="120" height="56" rx="6" />
  <text class="big green" x="800" y="377">19</text>
  <text class="small" x="510" y="424">an ordinary JavaScript function call into compiled code</text>
</svg>
