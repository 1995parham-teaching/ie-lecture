<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <title>What one click on the counter does: set state, render, reconcile, commit</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .head { font-size: 20px; font-weight: bold; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 16px; }
    .tree { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 16px; text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .panel { fill: none; stroke: #8d97a8; stroke-width: 1.5; }
    .hit { fill: rgba(255, 145, 0, 0.18); stroke: #ff9100; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .back { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#garrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .yellow { fill: #ffcc00; } .violet { fill: #ee82ee; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8d97a8" />
    </marker>
  </defs>

  <!-- the four steps -->
  <rect class="box" x="20" y="40" width="195" height="110" rx="8" />
  <text class="head yellow" x="117" y="66">1 · set state</text>
  <text class="mono" x="117" y="100">setValue(1)</text>
  <text class="small" x="117" y="128">click handler asks</text>

  <rect class="box" x="245" y="40" width="195" height="110" rx="8" />
  <text class="head green" x="342" y="66">2 · render</text>
  <text class="mono" x="342" y="100">Counter()</text>
  <text class="small" x="342" y="128">useState gives 1</text>

  <rect class="box" x="470" y="40" width="195" height="110" rx="8" />
  <text class="head cyan" x="567" y="66">3 · reconcile</text>
  <text class="small" x="567" y="100">compare the new</text>
  <text class="small" x="567" y="124">elements with the old</text>

  <rect class="box" x="695" y="40" width="185" height="110" rx="8" />
  <text class="head orange" x="787" y="66">4 · commit</text>
  <text class="small" x="787" y="100">change only what</text>
  <text class="small" x="787" y="124">differs in the DOM</text>

  <path class="line" d="M215,95 L243,95" />
  <path class="line" d="M440,95 L468,95" />
  <path class="line" d="M665,95 L693,95" />
  <path class="back" d="M787,40 L787,18 L117,18 L117,38" />
  <text class="small" x="452" y="10" style="font-size: 14px">wait for the next event</text>

  <!-- old vs new -->
  <rect class="panel" x="20" y="186" width="410" height="200" rx="8" />
  <text class="label" x="36" y="208">previous render (value = 0)</text>
  <text class="tree grey" x="40" y="246">&lt;&gt;</text>
  <text class="tree" x="64" y="276"><tspan class="orange">&lt;p&gt;</tspan>Counter value is: <tspan class="violet">0</tspan><tspan class="orange">&lt;/p&gt;</tspan></text>
  <text class="tree" x="64" y="306"><tspan class="orange">&lt;button</tspan> <tspan class="green">onClick</tspan><tspan class="orange">&gt;</tspan>Increment<tspan class="orange">&lt;/button&gt;</tspan></text>
  <text class="tree grey" x="40" y="336">&lt;/&gt;</text>

  <rect class="panel" x="470" y="186" width="410" height="200" rx="8" />
  <text class="label" x="486" y="208">this render (value = 1)</text>
  <text class="tree grey" x="490" y="246">&lt;&gt;</text>
  <rect class="hit" x="711" y="263" width="20" height="26" rx="4" />
  <text class="tree" x="514" y="276"><tspan class="orange">&lt;p&gt;</tspan>Counter value is: <tspan class="violet">1</tspan><tspan class="orange">&lt;/p&gt;</tspan></text>
  <text class="tree" x="514" y="306"><tspan class="orange">&lt;button</tspan> <tspan class="green">onClick</tspan><tspan class="orange">&gt;</tspan>Increment<tspan class="orange">&lt;/button&gt;</tspan></text>
  <text class="tree grey" x="490" y="336">&lt;/&gt;</text>
  <text class="label" x="486" y="366" style="font-size: 15px">same types in the same places → keep the nodes</text>

  <path class="line" d="M432,290 L468,290" />

  <!-- result -->
  <rect class="box" x="20" y="414" width="860" height="66" rx="8" />
  <text x="450" y="436" style="font-size: 18px">DOM mutations from this click: <tspan class="orange" font-weight="bold">one</tspan></text>
  <text class="small" x="450" y="462">the text node "0" becomes "1" — the &lt;p&gt; and the &lt;button&gt; are the very same DOM nodes as before</text>
</svg>
