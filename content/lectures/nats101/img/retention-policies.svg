<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <title>Retention policies: limits, interest and workqueue after the same acks</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dline { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <text class="small" x="403" y="22" style="font-size: 15px">messages, with the consumers that acked each</text>
  <text class="mono orange start" x="10" y="62">limits</text>
  <text class="label" x="10" y="90" style="font-size: 15px">kept until a limit:</text>
  <text class="label" x="10" y="110" style="font-size: 15px">age, bytes or count</text>
  <rect class="box" x="290" y="50" width="64" height="44" rx="4" />
  <text class="mono yellow" x="322" y="72">1</text>
  <text class="small" x="322" y="112" style="font-size: 13px">acked: a b</text>
  <rect class="box" x="370" y="50" width="64" height="44" rx="4" />
  <text class="mono yellow" x="402" y="72">2</text>
  <text class="small" x="402" y="112" style="font-size: 13px">acked: a</text>
  <rect class="box" x="450" y="50" width="64" height="44" rx="4" />
  <text class="mono yellow" x="482" y="72">3</text>
  <text class="small" x="482" y="112" style="font-size: 13px">not acked</text>
  <text class="label" x="560" y="72" style="font-size: 15px">acks change nothing</text>
  <text class="mono orange start" x="10" y="177">interest</text>
  <text class="label" x="10" y="205" style="font-size: 15px">kept while a consumer</text>
  <text class="label" x="10" y="225" style="font-size: 15px">still has to ack it</text>
  <rect class="dash" x="290" y="165" width="64" height="44" rx="4" />
  <text class="mono grey" x="322" y="187">1</text>
  <text class="small" x="322" y="227" style="font-size: 13px">acked: a b</text>
  <rect class="box" x="370" y="165" width="64" height="44" rx="4" />
  <text class="mono yellow" x="402" y="187">2</text>
  <text class="small" x="402" y="227" style="font-size: 13px">acked: a</text>
  <rect class="box" x="450" y="165" width="64" height="44" rx="4" />
  <text class="mono yellow" x="482" y="187">3</text>
  <text class="small" x="482" y="227" style="font-size: 13px">not acked</text>
  <text class="label" x="560" y="187" style="font-size: 15px">no consumers: not kept at all</text>
  <text class="mono orange start" x="10" y="292">workqueue</text>
  <text class="label" x="10" y="320" style="font-size: 15px">removed on the first ack;</text>
  <text class="label" x="10" y="340" style="font-size: 15px">one consumer per subject</text>
  <rect class="dash" x="290" y="280" width="64" height="44" rx="4" />
  <text class="mono grey" x="322" y="302">1</text>
  <text class="small" x="322" y="342" style="font-size: 13px">acked: w</text>
  <rect class="dash" x="370" y="280" width="64" height="44" rx="4" />
  <text class="mono grey" x="402" y="302">2</text>
  <text class="small" x="402" y="342" style="font-size: 13px">acked: w</text>
  <rect class="box" x="450" y="280" width="64" height="44" rx="4" />
  <text class="mono yellow" x="482" y="302">3</text>
  <text class="small" x="482" y="342" style="font-size: 13px">not acked</text>
  <text class="label" x="560" y="302" style="font-size: 15px">a stream used as a job queue</text>
  <rect class="dash" x="560" y="381" width="40" height="24" rx="4" />
  <text class="label" x="612" y="393" style="font-size: 15px">removed from the stream</text>
</svg>
