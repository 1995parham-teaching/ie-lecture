<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <title>Three NATS servers routed in a full mesh; when the client's server dies it reconnects to another one it learned about from INFO</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dline { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <rect class="box" x="230" y="70" width="160" height="80" rx="40" style="stroke: #ff5252" />
  <text x="310" y="100">nats-server</text>
  <text class="mono small" x="310" y="126" style="font-size: 14px">n0 :4222</text>
  <text class="red" x="310" y="52" style="font-size: 15px">killed (SIGTERM)</text>

  <rect class="box" x="510" y="70" width="160" height="80" rx="40" />
  <text x="590" y="100">nats-server</text>
  <text class="mono small" x="590" y="126" style="font-size: 14px">n1 :4223</text>
  <rect class="box" x="370" y="260" width="160" height="80" rx="40" />
  <text x="450" y="290">nats-server</text>
  <text class="mono small" x="450" y="316" style="font-size: 14px">n2 :4224</text>

  <path class="brace" d="M392,110 L508,110" />
  <path class="brace" d="M340,152 L415,258" />
  <path class="brace" d="M560,152 L485,258" />
  <text class="small" x="450" y="96" style="font-size: 14px">route</text>
  <text class="small" x="640" y="210" style="font-size: 14px">routes, full mesh</text>
  <text class="small" x="640" y="230" style="font-size: 14px">(cluster port 6222–6224)</text>

  <rect class="box" x="10" y="80" width="160" height="60" rx="6" />
  <text x="90" y="102" style="font-size: 18px">client</text>
  <text class="mono small" x="90" y="124" style="font-size: 13px">PUB tick ×40</text>
  <path class="brace" d="M172,110 L228,110" />
  <text class="red mono" x="200" y="96" style="font-size: 14px">EOF</text>
  <path class="dline" d="M90,142 L90,300 L366,300" />
  <text class="cyan start" x="104" y="270" style="font-size: 16px">reconnect after 0.61 s</text>
  <text class="small start" x="104" y="322" style="font-size: 14px">to a server it learned</text>
  <text class="small start" x="104" y="340" style="font-size: 14px">from INFO, not configured</text>

  <rect class="box" x="710" y="270" width="180" height="60" rx="6" />
  <text x="800" y="292" style="font-size: 18px">subscriber</text>
  <text class="mono small" x="800" y="314" style="font-size: 13px">SUB tick</text>
  <path class="brace" d="M532,300 L708,300" />
  <text class="green" x="800" y="352" style="font-size: 16px">got 40 of 40</text>

  <text class="label" x="10" y="398" style="font-size: 15px">The client was given only <tspan class="mono">nats://127.0.0.1:4222</tspan>. Messages it published while</text>
  <text class="label" x="10" y="422" style="font-size: 15px">disconnected waited in its reconnect buffer and were sent once it was back.</text>
</svg>
