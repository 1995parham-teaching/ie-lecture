<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <title>A queue group gets each message once, on one random member; a plain subscriber on the same subject still gets every message</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dline { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <rect class="box" x="10" y="130" width="160" height="80" rx="6" />
  <text x="90" y="158">requester</text>
  <text class="mono small" x="90" y="186" style="font-size: 14px">900 × help!</text>
  <path class="line" d="M172,170 L276,170" />
  <text class="mono yellow" x="224" y="154" style="font-size: 15px">help</text>

  <rect class="box" x="280" y="120" width="180" height="100" rx="50" />
  <text x="370" y="170">nats-server</text>

  <rect class="dash" x="560" y="10" width="330" height="270" rx="10" />
  <text class="label" x="576" y="34" style="font-size: 15px">queue group <tspan class="mono orange">workers</tspan></text>
  <rect class="box" x="600" y="54" width="250" height="56" rx="6" />
  <text class="start" x="616" y="82" style="font-size: 18px">worker 1</text>
  <text class="mono green" x="834" y="82" style="text-anchor: end; font-size: 18px">302</text>
  <rect class="box" x="600" y="128" width="250" height="56" rx="6" />
  <text class="start" x="616" y="156" style="font-size: 18px">worker 2</text>
  <text class="mono green" x="834" y="156" style="text-anchor: end; font-size: 18px">303</text>
  <rect class="box" x="600" y="202" width="250" height="56" rx="6" />
  <text class="start" x="616" y="230" style="font-size: 18px">worker 3</text>
  <text class="mono green" x="834" y="230" style="text-anchor: end; font-size: 18px">295</text>
  <path class="line" d="M455,150 L596,82" />
  <path class="line" d="M462,165 L596,156" />
  <path class="line" d="M455,190 L596,230" />
  <text class="small" x="480" y="82" style="font-size: 14px">one</text>
  <text class="small" x="480" y="100" style="font-size: 14px">member</text>

  <rect class="box" x="600" y="310" width="250" height="56" rx="6" />
  <text class="start" x="616" y="338" style="font-size: 18px">plain subscriber</text>
  <text class="mono green" x="834" y="338" style="text-anchor: end; font-size: 18px">900</text>
  <path class="dline" d="M400,218 L596,338" />
  <text class="small" x="470" y="310" style="font-size: 14px">every message</text>

  <text class="label" x="10" y="270" style="font-size: 15px">members subscribe with a queue name:</text>
  <text class="mono cyan start" x="10" y="294" style="font-size: 15px">SUB help workers 1</text>
  <text class="label" x="10" y="330" style="font-size: 15px">the plain one without:</text>
  <text class="mono violet start" x="10" y="354" style="font-size: 15px">SUB help 1</text>
  <text class="small" x="745" y="388" style="font-size: 13px">counts from one run of 900 requests</text>
</svg>
