<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <title>Exactly once: the server drops a duplicate Nats-Msg-Id, and the consumer waits for its ack to be confirmed</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dline { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <rect class="box" x="10" y="10" width="160" height="40" rx="6" />
  <text x="90" y="30" style="font-size: 18px">publisher</text>
  <path class="dash" d="M90,52 L90,460" />
  <rect class="box" x="400" y="10" width="160" height="40" rx="6" />
  <text x="480" y="30" style="font-size: 18px">nats-server</text>
  <path class="dash" d="M480,52 L480,460" />
  <rect class="box" x="738" y="10" width="160" height="40" rx="6" />
  <text x="818" y="30" style="font-size: 18px">consumer</text>
  <path class="dash" d="M818,52 L818,460" />
  <path class="line" d="M94,90 L474,90" />
  <text class="mono " x="285.0" y="76" style="font-size: 13px">PUB orders.new.6  <tspan class="yellow">Nats-Msg-Id: order-6</tspan></text>
  <path class="line" d="M476,140 L96,140" />
  <text class="mono green" x="285.0" y="126" style="font-size: 13px">{"stream":"ORDERS","seq":6}</text>
  <text class="red" x="285.0" y="141" style="font-size: 26px">✗</text>
  <text class="label" x="102" y="164" style="font-size: 14px">no ack: publish again</text>
  <path class="line" d="M94,212 L474,212" />
  <text class="mono " x="285.0" y="198" style="font-size: 13px">PUB orders.new.6  <tspan class="yellow">Nats-Msg-Id: order-6</tspan></text>
  <path class="line" d="M476,262 L96,262" />
  <text class="mono green" x="285.0" y="248" style="font-size: 13px">{"stream":"ORDERS","seq":6,"duplicate": true}</text>
  <text class="label" x="494" y="206" style="font-size: 14px">same id inside the window</text>
  <text class="label" x="494" y="226" style="font-size: 14px">(2 min by default): not stored again</text>
  <path class="brace" d="M20,292 L880,292" />
  <path class="line" d="M484,330 L812,330" />
  <text class="mono " x="649.0" y="316" style="font-size: 13px">message, stream seq 6</text>
  <path class="line" d="M814,380 L486,380" />
  <text class="mono orange" x="649.0" y="366" style="font-size: 13px">+ACK  (sent as a request)</text>
  <path class="line" d="M484,430 L812,430" />
  <text class="mono green" x="649.0" y="416" style="font-size: 13px">empty reply</text>
  <text class="label" x="120" y="370" style="font-size: 14px">double ack: the consumer</text>
  <text class="label" x="120" y="390" style="font-size: 14px">waits until the server</text>
  <text class="label" x="120" y="410" style="font-size: 14px">confirms the ack, so the</text>
  <text class="label" x="120" y="430" style="font-size: 14px">message is not sent again</text>
</svg>
