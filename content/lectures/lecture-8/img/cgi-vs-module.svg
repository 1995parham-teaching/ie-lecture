<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <title>CGI starts a new process for every request; a server module keeps the interpreter loaded in long-lived workers</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .gone { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <!-- CGI -->
  <text class="orange" x="225" y="26">CGI</text>
  <text class="small" x="225" y="52">a new process for every request</text>

  <text class="small" x="50" y="108">req 1</text>
  <path class="line" d="M80,108 L168,108" />
  <rect class="gone" x="170" y="80" width="250" height="56" rx="6" />
  <text class="mono" x="295" y="100" style="font-size: 16px">hello.cgi  <tspan class="cyan">pid 1671</tspan></text>
  <text class="small" x="295" y="122" style="font-size: 14px">fork → exec → run → <tspan class="red">exit</tspan></text>

  <text class="small" x="50" y="188">req 2</text>
  <path class="line" d="M80,188 L168,188" />
  <rect class="gone" x="170" y="160" width="250" height="56" rx="6" />
  <text class="mono" x="295" y="180" style="font-size: 16px">hello.cgi  <tspan class="cyan">pid 1678</tspan></text>
  <text class="small" x="295" y="202" style="font-size: 14px">fork → exec → run → <tspan class="red">exit</tspan></text>

  <text class="small" x="50" y="268">req 3</text>
  <path class="line" d="M80,268 L168,268" />
  <rect class="gone" x="170" y="240" width="250" height="56" rx="6" />
  <text class="mono" x="295" y="260" style="font-size: 16px">hello.cgi  <tspan class="cyan">pid 1681</tspan></text>
  <text class="small" x="295" y="282" style="font-size: 14px">fork → exec → run → <tspan class="red">exit</tspan></text>

  <text class="red" x="225" y="336" style="font-size: 17px">start-up cost paid on every request</text>

  <path d="M450,20 L450,360" style="stroke: #555b66; stroke-width: 2" />

  <!-- module -->
  <text class="green" x="675" y="26">Server module (e.g. mod_php)</text>
  <text class="small" x="675" y="52">the interpreter lives inside the server</text>

  <text class="small" x="500" y="108">req 1</text>
  <text class="small" x="500" y="188">req 2</text>
  <text class="small" x="500" y="268">req 3</text>
  <path class="line" d="M530,108 L638,150" />
  <path class="line" d="M530,188 L638,188" />
  <path class="line" d="M530,268 L638,226" />
  <rect class="box" x="640" y="110" width="230" height="156" rx="6" />
  <text x="755" y="146" style="font-size: 18px">server worker</text>
  <text class="small" x="755" y="174">process or thread</text>
  <text class="green" x="755" y="210" style="font-size: 17px">+ PHP interpreter</text>
  <text class="small" x="755" y="236">loaded once, reused</text>

  <text class="green" x="675" y="336" style="font-size: 17px">start-up cost paid once</text>

  <text class="label" x="20" y="396" style="font-size: 13px">The three pids are from three real requests to one CGI script: each request got a new process.</text>
</svg>
