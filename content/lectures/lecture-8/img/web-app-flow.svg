<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604">
  <title>A typical web application: the server decides every answer — redirect to login, check the password, set a session cookie, build the page, answer fetch() with JSON</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 14px; fill: #b0b4bc; }
    .label { font-size: 14px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .note { fill: rgba(238, 130, 238, 0.10); stroke: #ee82ee; stroke-width: 1.5; }
    .life { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .back { fill: none; stroke: #cfd3da; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <rect class="box" x="15" y="10" width="130" height="40" rx="6" />
  <text x="80" y="30">Browser</text>
  <rect class="box" x="535" y="10" width="130" height="40" rx="6" />
  <text x="600" y="30">Server</text>
  <rect class="box" x="770" y="10" width="120" height="40" rx="6" />
  <text x="830" y="30">Database</text>
  <path class="life" d="M80,52 L80,598" />
  <path class="life" d="M600,52 L600,598" />
  <path class="life" d="M830,52 L830,598" />
  <!-- 1. not logged in -->
  <path class="line" d="M82,88 L598,88" />
  <text class="mono" x="340" y="77"><tspan class="cyan">GET</tspan> /</text>
  <rect class="note" x="610" y="91" width="140" height="26" rx="4" />
  <text class="small" x="680" y="104" style="fill: #eeeeee">no session cookie</text>
  <path class="back" d="M598,120 L82,120" />
  <text class="mono" x="340" y="109"><tspan class="orange">302 Found</tspan>&#160; Location: /login</text>
  <!-- 2. the login form -->
  <path class="line" d="M82,162 L598,162" />
  <text class="mono" x="340" y="151"><tspan class="cyan">GET</tspan> /login</text>
  <path class="back" d="M598,194 L82,194" />
  <text class="mono" x="340" y="183"><tspan class="green">200 OK</tspan>&#160; &lt;form …&gt;</text>
  <!-- 3. log in -->
  <path class="line" d="M82,236 L598,236" />
  <text class="mono" x="340" y="225"><tspan class="violet">POST</tspan> /login&#160; user=ali&amp;pass=s3cret</text>
  <path class="line" d="M602,258 L828,258" />
  <text class="small" x="715" y="248">look up user ali</text>
  <path class="back" d="M828,280 L602,280" />
  <text class="small" x="715" y="270">stored password</text>
  <rect class="note" x="610" y="289" width="140" height="26" rx="4" />
  <text class="small" x="680" y="302" style="fill: #eeeeee">check password</text>
  <path class="back" d="M598,328 L82,328" />
  <text class="mono" x="340" y="317"><tspan class="orange">303 See Other</tspan>&#160; <tspan class="yellow">Set-Cookie: session=7f3a9c</tspan></text>
  <!-- 4. the home page, built for this user -->
  <path class="line" d="M82,370 L598,370" />
  <text class="mono" x="340" y="359"><tspan class="cyan">GET</tspan> /&#160; <tspan class="yellow">Cookie: session=7f3a9c</tspan></text>
  <path class="back" d="M598,402 L82,402" />
  <text class="mono" x="340" y="391"><tspan class="green">200 OK</tspan>&#160; &lt;h1&gt;Hello, ali&lt;/h1&gt;</text>
  <!-- 5. fetch() from the page -->
  <path class="line" d="M82,444 L598,444" />
  <text class="mono" x="340" y="433">fetch("/api/orders")</text>
  <path class="line" d="M602,466 L828,466" />
  <text class="small" x="715" y="456">query orders</text>
  <path class="back" d="M828,490 L602,490" />
  <text class="small" x="715" y="480">rows</text>
  <path class="back" d="M598,514 L82,514" />
  <text class="mono" x="340" y="503"><tspan class="green">200 OK</tspan>&#160; application/json&#160; [{"id":12,"total":40}]</text>
  <!-- 6. log out -->
  <path class="line" d="M82,556 L598,556" />
  <text class="mono" x="340" y="545"><tspan class="violet">POST</tspan> /logout</text>
  <path class="back" d="M598,588 L82,588" />
  <text class="mono" x="340" y="577"><tspan class="orange">303 See Other</tspan>&#160; <tspan class="yellow">Set-Cookie: session=; Max-Age=0</tspan></text>
</svg>
