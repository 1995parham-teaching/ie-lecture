<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <title>Block elements stack down; inline elements flow along the line</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <text class="yellow" x="230.0" y="24" style="font-size: 18px">dir="ltr" — the default</text>
  <rect class="dash" x="30" y="44" width="400" height="340" rx="6" />
  <rect class="box" x="46" y="60" width="368" height="44" />
  <text class="cyan mono" x="230.0" y="82" style="font-size: 17px">&lt;h1&gt; block</text>
  <rect class="box" x="46" y="118" width="368" height="150" />
  <text class="cyan mono" x="230.0" y="136" style="font-size: 17px">&lt;p&gt; block</text>
  <rect x="58" y="158" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="93.0" y="176.0" style="font-size: 17px">1</text>
  <rect x="138" y="158" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="173.0" y="176.0" style="font-size: 17px">2</text>
  <rect x="218" y="158" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="253.0" y="176.0" style="font-size: 17px">3</text>
  <rect x="298" y="158" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="333.0" y="176.0" style="font-size: 17px">4</text>
  <rect x="58" y="208" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="93.0" y="226.0" style="font-size: 17px">5</text>
  <rect x="138" y="208" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="173.0" y="226.0" style="font-size: 17px">6</text>
  <path class="line" d="M58,264 H354" />
  <rect class="box" x="46" y="282" width="368" height="44" />
  <text class="cyan mono" x="230.0" y="304" style="font-size: 17px">&lt;div&gt; block</text>
  <rect class="box" x="46" y="338" width="368" height="32" />
  <text class="cyan mono" x="230.0" y="354" style="font-size: 17px">&lt;table&gt; block</text>
  <text class="yellow" x="670.0" y="24" style="font-size: 18px">dir="rtl" — e.g. Persian</text>
  <rect class="dash" x="470" y="44" width="400" height="340" rx="6" />
  <rect class="box" x="486" y="60" width="368" height="44" />
  <text class="cyan mono" x="670.0" y="82" style="font-size: 17px">&lt;h1&gt; block</text>
  <rect class="box" x="486" y="118" width="368" height="150" />
  <text class="cyan mono" x="670.0" y="136" style="font-size: 17px">&lt;p&gt; block</text>
  <rect x="772" y="158" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="807.0" y="176.0" style="font-size: 17px">1</text>
  <rect x="692" y="158" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="727.0" y="176.0" style="font-size: 17px">2</text>
  <rect x="612" y="158" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="647.0" y="176.0" style="font-size: 17px">3</text>
  <rect x="532" y="158" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="567.0" y="176.0" style="font-size: 17px">4</text>
  <rect x="772" y="208" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="807.0" y="226.0" style="font-size: 17px">5</text>
  <rect x="692" y="208" width="70" height="36" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="727.0" y="226.0" style="font-size: 17px">6</text>
  <path class="line" d="M842,264 H546" />
  <rect class="box" x="486" y="282" width="368" height="44" />
  <text class="cyan mono" x="670.0" y="304" style="font-size: 17px">&lt;div&gt; block</text>
  <rect class="box" x="486" y="338" width="368" height="32" />
  <text class="cyan mono" x="670.0" y="354" style="font-size: 17px">&lt;table&gt; block</text>
  <rect x="40" y="406" width="26" height="20" rx="4" style="fill: rgba(118,255,3,0.12); stroke: #76ff03; stroke-width: 1.5" />
  <text class="label" x="76" y="416">inline: &lt;em&gt; &lt;a&gt; &lt;code&gt; &lt;img&gt; … — placed in order 1, 2, 3 and wrapped</text>
  <rect class="box" x="40" y="432" width="26" height="14" /><text class="label" x="76" y="439">block: always starts a new line and takes the full width</text>
</svg>
