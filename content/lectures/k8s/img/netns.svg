<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530">
  <title>play_with_netns.sh: two network namespaces joined first by one veth pair, then through a bridge with NAT to the outside</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .head { font-size: 19px; text-anchor: start; }
    .small { font-size: 14px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
    .ns { fill: rgba(0, 229, 255, 0.07); stroke: #00e5ff; stroke-width: 2; }
    .host { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .if { fill: rgba(255, 255, 255, 0.08); stroke: #cfd3da; stroke-width: 2; }
    .br { fill: rgba(238, 130, 238, 0.12); stroke: #ee82ee; stroke-width: 2; }
    .veth { fill: none; stroke: #ff9100; stroke-width: 3; }
    .nat { fill: none; stroke: #76ff03; stroke-width: 2; marker-end: url(#ga); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#76ff03" /></marker>
  </defs>

  <!-- A: veth pair -->
  <text class="head" x="20" y="18">1. a veth pair: a cable with one end in each namespace</text>
  <rect class="ns" x="20" y="40" width="300" height="90" rx="8" />
  <text class="cyan" x="170" y="60" style="font-size: 16px">netns parham</text>
  <rect class="if" x="170" y="76" width="140" height="44" rx="5" />
  <text class="mono" x="240" y="91">head1</text>
  <text class="mono green" x="240" y="109" style="font-size: 13px">192.168.2.1/24</text>
  <rect class="ns" x="580" y="40" width="300" height="90" rx="8" />
  <text class="cyan" x="730" y="60" style="font-size: 16px">netns mohammad</text>
  <rect class="if" x="590" y="76" width="140" height="44" rx="5" />
  <text class="mono" x="660" y="91">head2</text>
  <text class="mono green" x="660" y="109" style="font-size: 13px">192.168.2.2/24</text>
  <path class="veth" d="M312,98 L588,98" />
  <text class="orange" x="450" y="86" style="font-size: 15px">veth</text>
  <text class="mono small" x="450" y="150" style="font-size: 13px"><tspan class="grey">ip netns exec parham</tspan> ping -c 3 192.168.2.2 <tspan class="green">→ 3 received</tspan></text>

  <!-- B: bridge -->
  <text class="head" x="20" y="196">2. a bridge: a switch in the host namespace, one veth per namespace</text>
  <rect class="host" x="20" y="216" width="860" height="260" rx="8" />
  <text class="small grey" x="868" y="462" style="text-anchor: end">host namespace</text>

  <rect class="ns" x="40" y="236" width="230" height="88" rx="8" />
  <text class="cyan" x="155" y="254" style="font-size: 15px">netns parham</text>
  <rect class="if" x="60" y="268" width="190" height="44" rx="5" />
  <text class="mono" x="155" y="282">parham-end</text>
  <text class="mono green" x="155" y="300" style="font-size: 13px">192.168.2.1/24</text>

  <rect class="ns" x="630" y="236" width="230" height="88" rx="8" />
  <text class="cyan" x="745" y="254" style="font-size: 15px">netns mohammad</text>
  <rect class="if" x="650" y="268" width="190" height="44" rx="5" />
  <text class="mono" x="745" y="282">mohammad-end</text>
  <text class="mono green" x="745" y="300" style="font-size: 13px">192.168.2.2/24</text>

  <rect class="br" x="300" y="360" width="300" height="76" rx="6" />
  <text class="violet" x="450" y="376" style="font-size: 16px">my-bridge</text>
  <rect class="if" x="312" y="390" width="128" height="34" rx="4" />
  <text class="mono" x="376" y="407" style="font-size: 13px">parham-br</text>
  <rect class="if" x="460" y="390" width="128" height="34" rx="4" />
  <text class="mono" x="524" y="407" style="font-size: 13px">mohammad-br</text>
  <text class="mono small" x="450" y="454" style="font-size: 13px"><tspan class="green">192.168.2.254/24</tspan>: the gateway</text>

  <path class="veth" d="M155,314 C155,370 250,407 310,407" />
  <path class="veth" d="M745,314 C745,370 650,407 590,407" />

  <!-- NAT -->
  <rect class="if" x="300" y="236" width="300" height="88" rx="6" />
  <text class="green" x="450" y="254" style="font-size: 15px">iptables NAT</text>
  <text class="mono small" x="450" y="276" style="font-size: 12px">MASQUERADE  192.168.2.0/24 → out</text>
  <text class="mono small" x="450" y="296" style="font-size: 12px">DNAT  :80 → 192.168.2.2:80</text>
  <text class="small" x="450" y="314" style="font-size: 12px">default routes via .254, ip_forward=1</text>
  <path class="nat" d="M450,358 L450,328" />

  <text class="mono small" x="20" y="500" style="text-anchor: start; font-size: 13px"><tspan class="grey">ip netns exec parham</tspan> ping 192.168.2.2 <tspan class="green">→ via the bridge</tspan></text>
  <text class="mono small" x="470" y="500" style="text-anchor: start; font-size: 13px">ping 1.1.1.1 <tspan class="green">→ out via NAT</tspan></text>
  <text class="mono small" x="20" y="520" style="text-anchor: start; font-size: 13px"><tspan class="grey">another host:</tspan> wget http://host/ <tspan class="green">→ served from netns mohammad</tspan></text>
</svg>
