<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490">
  <title>argon2id stores the algorithm, cost, salt and hash in one string; the same password hashed twice gives different strings, and login recomputes and compares</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .head { font-size: 20px; text-anchor: start; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .label { font-size: 15px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .fn { fill: rgba(255, 204, 0, 0.10); stroke: #ffcc00; stroke-width: 2; }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .bar { stroke-width: 0; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" /></marker>
  </defs>

  <!-- sign up -->
  <text class="head" x="20" y="20">Sign up</text>
  <rect class="box" x="20" y="40" width="210" height="40" rx="5" />
  <text class="mono" x="36" y="61"><tspan class="grey">pw =</tspan> hunter2</text>
  <rect class="box" x="20" y="90" width="210" height="40" rx="5" />
  <text class="mono" x="36" y="111"><tspan class="grey">salt =</tspan> <tspan class="cyan">16 random bytes</tspan></text>
  <path class="line" d="M232,60 C260,60 260,85 286,85" />
  <path class="line" d="M232,110 C260,110 260,85 286,85" />
  <rect class="fn" x="290" y="60" width="200" height="50" rx="5" />
  <text class="yellow" x="390" y="78">argon2id</text>
  <text class="small" x="390" y="98" style="font-size: 13px">19 MiB, 2 passes, 1 lane</text>
  <path class="line" d="M492,85 L530,85" />
  <text class="label" x="540" y="70">store one string, nothing else:</text>
  <text class="label" x="540" y="94" style="font-size: 13px">algorithm, cost, salt and hash travel together</text>

  <!-- PHC strings -->
  <text class="mono" x="20" y="160"><tspan class="violet">$argon2id</tspan><tspan class="grey">$v=19</tspan><tspan class="orange">$m=19456,t=2,p=1</tspan><tspan class="cyan">$ymTgjZbGdy3kFye7fmKx3w</tspan><tspan class="green">$+GBoG4kXh/7ABuYslD9c8ECeFJZLMnXgxXvybE53dKU</tspan></text>
  <text class="mono" x="20" y="186"><tspan class="violet">$argon2id</tspan><tspan class="grey">$v=19</tspan><tspan class="orange">$m=19456,t=2,p=1</tspan><tspan class="cyan">$tTV386gDx038SFcjQPL71Q</tspan><tspan class="green">$0SDN8lQ6OehokGW4REd0cqmd9mqqGcGB7X3wIC2iTO4</tspan></text>
  <!-- 8.43 px per char at 14px Menlo -->
  <path class="brace" d="M22,200 L22,208 L94,208 L94,200" />
  <text class="violet" x="58" y="224" style="font-size: 14px">algorithm</text>
  <path class="brace" d="M140,200 L140,208 L271,208 L271,200" />
  <text class="orange" x="205" y="224" style="font-size: 14px">cost</text>
  <path class="brace" d="M275,200 L275,208 L465,208 L465,200" />
  <text class="cyan" x="370" y="224" style="font-size: 14px">salt</text>
  <path class="brace" d="M469,200 L469,208 L836,208 L836,200" />
  <text class="green" x="652" y="224" style="font-size: 14px">hash</text>
  <text class="small" x="450" y="252">the same password <tspan class="mono" style="font-size: 14px">hunter2</tspan> twice: different salts, so different hashes</text>

  <!-- log in -->
  <text class="head" x="20" y="296">Log in</text>
  <rect class="box" x="20" y="316" width="240" height="56" rx="5" />
  <text class="small" x="140" y="334" style="font-size: 14px">read <tspan class="orange">cost</tspan> and <tspan class="cyan">salt</tspan></text>
  <text class="small" x="140" y="356" style="font-size: 14px">from the stored string</text>
  <path class="line" d="M262,344 L300,344" />
  <rect class="fn" x="304" y="316" width="240" height="56" rx="5" />
  <text class="yellow" x="424" y="334" style="font-size: 16px">argon2id(typed pw, salt)</text>
  <text class="small" x="424" y="356" style="font-size: 14px">same cost as stored</text>
  <path class="line" d="M546,344 L584,344" />
  <rect class="box" x="588" y="316" width="292" height="56" rx="5" />
  <text class="small" x="734" y="334" style="font-size: 14px">compare with the stored <tspan class="green">hash</tspan></text>
  <text class="small" x="734" y="356" style="font-size: 14px">in constant time</text>

  <!-- speed -->
  <text class="label" x="20" y="410">guesses per second, one CPU core of this laptop:</text>
  <rect class="bar" x="130" y="428" width="600" height="20" rx="3" fill="#ff5252" />
  <text class="mono" x="20" y="438" style="font-size: 15px">SHA-256</text>
  <text class="mono red" x="742" y="438" style="font-size: 15px">10,000,000+</text>
  <rect class="bar" x="130" y="458" width="3" height="20" fill="#76ff03" />
  <text class="mono" x="20" y="468" style="font-size: 15px">argon2id</text>
  <text class="mono green" x="144" y="468" style="font-size: 15px">~60</text>
</svg>
