<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <title>A JWT is three base64url parts: a readable header, a readable payload, and an HMAC signature over the first two</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 18px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 15px; fill: #b0b4bc; }
    .label { font-size: 15px; fill: #b0b4bc; text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 15px; text-anchor: start; }
    .h { fill: rgba(255, 82, 82, 0.10); stroke: #ff5252; stroke-width: 2; }
    .p { fill: rgba(238, 130, 238, 0.10); stroke: #ee82ee; stroke-width: 2; }
    .s { fill: rgba(0, 229, 255, 0.10); stroke: #00e5ff; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" /></marker>
  </defs>

  <!-- header -->
  <rect class="h" x="20" y="14" width="860" height="104" rx="6" />
  <text class="red" x="34" y="34" style="text-anchor: start; font-size: 16px">header</text>
  <text class="mono red" x="34" y="62">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9<tspan class="grey">.</tspan></text>
  <path class="line" d="M60,76 L60,96 L80,96" />
  <text class="mono" x="90" y="97">{"alg":"HS256","typ":"JWT"}</text>
  <text class="label" x="440" y="97" style="font-size: 14px">base64url-decode: no key needed</text>

  <!-- payload -->
  <rect class="p" x="20" y="130" width="860" height="132" rx="6" />
  <text class="violet" x="34" y="150" style="text-anchor: start; font-size: 16px">payload <tspan class="small">(claims)</tspan></text>
  <text class="mono violet" x="34" y="178">eyJzdWIiOiI0MiIsIm5hbWUiOiJBbGljZSIsImV4cCI6MTgwMDAwMDAwMH0<tspan class="grey">.</tspan></text>
  <path class="line" d="M60,192 L60,212 L80,212" />
  <text class="mono" x="90" y="213">{"sub":"42","name":"Alice","exp":1800000000}</text>
  <text class="label" x="90" y="242" style="font-size: 14px"><tspan class="red">anyone</tspan> holding the token can read this — never put secrets here</text>
  <text class="label" x="560" y="213" style="font-size: 14px">exp = 2027-01-15 08:00 UTC</text>

  <!-- signature -->
  <rect class="s" x="20" y="274" width="860" height="112" rx="6" />
  <text class="cyan" x="34" y="294" style="text-anchor: start; font-size: 16px">signature</text>
  <text class="mono cyan" x="34" y="322">88gEV1PFC_5vLzgofKhKr21E1JDzQ1eINmz1Kc-u-0Y</text>
  <path class="line" d="M60,336 L60,356 L80,356" />
  <text class="mono" x="90" y="357"><tspan class="yellow">HMAC-SHA256</tspan>(<tspan class="green">secret</tspan>, <tspan class="red">header</tspan> + "." + <tspan class="violet">payload</tspan>)</text>
  <text class="label" x="560" y="357" style="font-size: 14px">only the server knows the secret</text>

  <text class="small" x="450" y="416">Change one character of the payload and the signature no longer matches: <tspan class="green">signed</tspan>, <tspan class="red">not encrypted</tspan>.</text>
</svg>
