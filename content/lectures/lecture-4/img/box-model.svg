<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 498.0">
  <title>The box model: content, padding, border and margin, with their widths added up</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .thin { fill: none; stroke: #8d97a8; stroke-width: 1.5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <rect x="30.0" y="40.0" width="496.0" height="336.0" style="fill: rgba(255,145,0,0.08); stroke: #ff9100; stroke-width: 1.5; stroke-dasharray: 6 5" />
  <rect x="82.0" y="92.0" width="392.0" height="232.0" style="fill: none; stroke: #cfd3da; stroke-width: 8" />
  <rect x="86.0" y="96.0" width="384.0" height="224.0" style="fill: rgba(118,255,3,0.1); stroke: none" />
  <rect x="118.0" y="128.0" width="320.0" height="160.0" style="fill: rgba(0,229,255,0.1); stroke: #00e5ff; stroke-width: 1.5" />
  <text class="orange" x="278.0" y="64.0" style="font-size: 18px">margin 30px</text>
  <text class="green" x="278.0" y="112.0" style="font-size: 18px">padding 20px</text>
  <text class="cyan" x="278.0" y="196.8" style="font-size: 20px">content</text>
  <text class="mono" x="278.0" y="228.8" style="font-size: 17px">200 × 100</text>
  <text class="small" x="278.0" y="352.0" style="font-size: 16px">border 5px (the light frame)</text>
  <path class="thin" d="M30.0,410.0 H526.0" />
  <path class="thin" d="M30.0,403.0 V417.0" />
  <text class="orange mono" x="54.0" y="430.0" style="font-size: 15px">30</text>
  <path class="thin" d="M78.0,403.0 V417.0" />
  <path class="thin" d="M86.0,403.0 V417.0" />
  <text class="green mono" x="102.0" y="430.0" style="font-size: 15px">20</text>
  <path class="thin" d="M118.0,403.0 V417.0" />
  <text class="cyan mono" x="278.0" y="430.0" style="font-size: 15px">200</text>
  <path class="thin" d="M438.0,403.0 V417.0" />
  <text class="green mono" x="454.0" y="430.0" style="font-size: 15px">20</text>
  <path class="thin" d="M470.0,403.0 V417.0" />
  <path class="thin" d="M478.0,403.0 V417.0" />
  <text class="orange mono" x="502.0" y="430.0" style="font-size: 15px">30</text>
  <path class="thin" d="M526.0,403.0 V417.0" />
  <text class="grey mono" x="82.0" y="430.0" style="font-size: 13px">5</text>
  <text class="grey mono" x="474.0" y="430.0" style="font-size: 13px">5</text>
  <path class="thin" d="M78.0,452.0 V458.0 H478.0 V452.0" style="stroke: #cfd3da" />
  <text x="278.0" y="476.0" style="font-size: 17px">the box you see: 250 × 150</text>
  <rect class="box" x="600" y="40" width="330" height="200" rx="4" />
  <text class="mono start" x="620" y="70" style="font-size: 17px">width: 200px;</text>
  <text class="mono start" x="620" y="102" style="font-size: 17px">height: 100px;</text>
  <text class="mono start" x="620" y="134" style="font-size: 17px">padding: 20px;</text>
  <text class="mono start" x="620" y="166" style="font-size: 17px">border: 5px solid;</text>
  <text class="mono start" x="620" y="198" style="font-size: 17px">margin: 30px;</text>
  <text class="mono start yellow" x="600" y="290" style="font-size: 16px">box-sizing: content-box</text>
  <text class="label" x="600" y="314" style="font-size: 15px">(the default) — width is the content</text>
  <text class="mono label" x="600" y="338" style="font-size: 15px">5+20+200+20+5 = 250px wide</text>
  <text class="mono start yellow" x="600" y="384" style="font-size: 16px">box-sizing: border-box</text>
  <text class="label" x="600" y="408" style="font-size: 15px">width is the border box —</text>
  <text class="label" x="600" y="432" style="font-size: 15px">the same rule gives 200 × 100</text>
</svg>
