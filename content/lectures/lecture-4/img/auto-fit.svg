<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 399">
  <title>repeat(auto-fit, minmax(200px, 1fr)) at 380, 600 and 860px</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .start { text-anchor: start; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .fixed { fill: rgba(141, 151, 168, 0.25); stroke: #8d97a8; stroke-width: 2; }
    .left { fill: rgba(255, 145, 0, 0.12); stroke: #ff9100; stroke-width: 2; stroke-dasharray: 6 5; }
    .fr1 { fill: rgba(118, 255, 3, 0.16); stroke: #76ff03; stroke-width: 2; }
    .fr2 { fill: rgba(0, 229, 255, 0.16); stroke: #00e5ff; stroke-width: 2; }
    .gap { fill: none; stroke: #ff5252; stroke-width: 1.5; stroke-dasharray: 2 3; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .thin { fill: none; stroke: #8d97a8; stroke-width: 1.5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; } .red { fill: #ff5252; }
  </style>

  <text class="mono start" x="20" y="30" style="font-size: 18px">container <tspan class="orange">380px</tspan></text>
  <rect class="dash" x="16" y="48" width="331.0" height="144.0" rx="4" />
  <rect class="fr1" x="20.0" y="52.0" width="323.0" height="23.8" rx="3" />
  <text class="mono" x="181.5" y="63.9" style="font-size: 15px">1</text>
  <rect class="fr1" x="20.0" y="89.4" width="323.0" height="23.8" rx="3" />
  <text class="mono" x="181.5" y="101.3" style="font-size: 15px">2</text>
  <rect class="fr1" x="20.0" y="126.8" width="323.0" height="23.8" rx="3" />
  <text class="mono" x="181.5" y="138.7" style="font-size: 15px">3</text>
  <rect class="fr1" x="20.0" y="164.2" width="323.0" height="23.8" rx="3" />
  <text class="mono" x="181.5" y="176.1" style="font-size: 15px">4</text>
  <text class="green start" x="20" y="214.0" style="font-size: 17px">1 column of 380px</text>
  <text class="small start" x="20" y="236.0" style="font-size: 15px">a 2nd column needs 2×200 + 16 = 416px</text>
  <text class="mono start" x="373.0" y="30" style="font-size: 18px">container <tspan class="orange">600px</tspan></text>
  <rect class="dash" x="369.0" y="48" width="518.0" height="69.2" rx="4" />
  <rect class="fr1" x="373.0" y="52.0" width="248.2" height="23.8" rx="3" />
  <text class="mono" x="497.1" y="63.9" style="font-size: 15px">1</text>
  <rect class="fr1" x="634.8" y="52.0" width="248.2" height="23.8" rx="3" />
  <text class="mono" x="758.9" y="63.9" style="font-size: 15px">2</text>
  <rect class="fr1" x="373.0" y="89.4" width="248.2" height="23.8" rx="3" />
  <text class="mono" x="497.1" y="101.3" style="font-size: 15px">3</text>
  <rect class="fr1" x="634.8" y="89.4" width="248.2" height="23.8" rx="3" />
  <text class="mono" x="758.9" y="101.3" style="font-size: 15px">4</text>
  <text class="green start" x="373.0" y="139.2" style="font-size: 17px">2 columns of 292px</text>
  <text class="small start" x="373.0" y="161.2" style="font-size: 15px">a 3rd column needs 3×200 + 2×16 = 632px</text>
  <text class="mono start" x="20" y="282.0" style="font-size: 18px">container <tspan class="orange">860px</tspan></text>
  <rect class="dash" x="16" y="300.0" width="739.0" height="31.8" rx="4" />
  <rect class="fr1" x="20.0" y="304.0" width="172.5" height="23.8" rx="3" />
  <text class="mono" x="106.3" y="315.9" style="font-size: 15px">1</text>
  <rect class="fr1" x="206.2" y="304.0" width="172.5" height="23.8" rx="3" />
  <text class="mono" x="292.4" y="315.9" style="font-size: 15px">2</text>
  <rect class="fr1" x="392.3" y="304.0" width="172.5" height="23.8" rx="3" />
  <text class="mono" x="478.6" y="315.9" style="font-size: 15px">3</text>
  <rect class="fr1" x="578.4" y="304.0" width="172.5" height="23.8" rx="3" />
  <text class="mono" x="664.7" y="315.9" style="font-size: 15px">4</text>
  <text class="green start" x="20" y="353.8" style="font-size: 17px">4 columns of 203px</text>
  <text class="small start" x="20" y="375.8" style="font-size: 15px">4×200 + 3×16 = 848px fits; a 5th needs 1064px</text>
</svg>
