<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445">
  <title>Flexbox main and cross axes for row and column</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .thin { fill: none; stroke: #8d97a8; stroke-width: 1.5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <defs>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9100" /></marker>
    <marker id="arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00e5ff" /></marker>
  </defs>
  <text class="mono yellow" x="220" y="24" style="font-size: 18px">flex-direction: row</text>
  <text class="small" x="220" y="48" style="font-size: 14px">(the default)</text>
  <rect class="box" x="40" y="90" width="360" height="150" rx="4" />
  <rect x="60" y="115" width="100" height="100" rx="4" style="fill: rgba(118,255,3,0.14); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="110" y="165" style="font-size: 22px">1</text>
  <rect x="170" y="115" width="100" height="100" rx="4" style="fill: rgba(118,255,3,0.14); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="220" y="165" style="font-size: 22px">2</text>
  <rect x="280" y="115" width="100" height="100" rx="4" style="fill: rgba(118,255,3,0.14); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="330" y="165" style="font-size: 22px">3</text>
  <path d="M40,270 H400" style="fill: none; stroke: #ff9100; stroke-width: 3; marker-end: url(#arrow-o)" />
  <text class="orange" x="220" y="295" style="font-size: 18px">main axis</text>
  <text class="mono small" x="220" y="318" style="font-size: 15px">justify-content</text>
  <path d="M425,90 V240" style="fill: none; stroke: #00e5ff; stroke-width: 3; marker-end: url(#arrow-c)" />
  <text class="cyan start" x="440" y="155" style="font-size: 18px">cross axis</text>
  <text class="mono small start" x="440" y="179" style="font-size: 15px">align-items</text>
  <text class="mono yellow" x="690" y="24" style="font-size: 18px">flex-direction: column</text>
  <rect class="box" x="610" y="60" width="160" height="300" rx="4" />
  <rect x="640" y="75" width="100" height="80" rx="4" style="fill: rgba(118,255,3,0.14); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="690" y="115" style="font-size: 22px">1</text>
  <rect x="640" y="170" width="100" height="80" rx="4" style="fill: rgba(118,255,3,0.14); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="690" y="210" style="font-size: 22px">2</text>
  <rect x="640" y="265" width="100" height="80" rx="4" style="fill: rgba(118,255,3,0.14); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green mono" x="690" y="305" style="font-size: 22px">3</text>
  <path d="M800,60 V360" style="fill: none; stroke: #ff9100; stroke-width: 3; marker-end: url(#arrow-o)" />
  <text class="orange start" x="815" y="200" style="font-size: 18px">main axis</text>
  <text class="mono small start" x="815" y="224" style="font-size: 15px">justify-content</text>
  <path d="M610,385 H770" style="fill: none; stroke: #00e5ff; stroke-width: 3; marker-end: url(#arrow-c)" />
  <text class="cyan" x="690" y="408" style="font-size: 18px">cross axis</text>
  <text class="mono small" x="690" y="431" style="font-size: 15px">align-items</text>
</svg>
