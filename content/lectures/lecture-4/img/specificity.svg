<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 468">
  <title>Specificity is three counts compared left to right</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .thin { fill: none; stroke: #8d97a8; stroke-width: 1.5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <rect x="333" y="16" width="164" height="104" rx="4" style="fill: rgba(255,82,82,0.1); stroke: #ff5252; stroke-width: 1.5" />
  <text class="red" x="415" y="51" style="font-size: 18px">IDs</text>
  <text class="mono small" x="415" y="98" style="font-size: 15px">#nav</text>
  <rect x="513" y="16" width="164" height="104" rx="4" style="fill: rgba(255,204,0,0.1); stroke: #ffcc00; stroke-width: 1.5" />
  <text class="yellow" x="595" y="40" style="font-size: 18px">classes, attributes,</text>
  <text class="yellow" x="595" y="62" style="font-size: 18px">pseudo-classes</text>
  <text class="mono small" x="595" y="98" style="font-size: 15px">.c  [type]  :hover</text>
  <rect x="693" y="16" width="164" height="104" rx="4" style="fill: rgba(118,255,3,0.1); stroke: #76ff03; stroke-width: 1.5" />
  <text class="green" x="775" y="40" style="font-size: 18px">types,</text>
  <text class="green" x="775" y="62" style="font-size: 18px">pseudo-elements</text>
  <text class="mono small" x="775" y="98" style="font-size: 15px">p  h1  ::before</text>
  <text class="label" x="40" y="68" style="font-size: 18px">selector</text>
  <rect class="box" x="30" y="140" width="830" height="46" rx="4" />
  <text class="mono cyan start" x="50" y="163" style="font-size: 20px">p</text>
  <text class="mono small start" x="200" y="163" style="font-size: 15px">color: red</text>
  <text class="grey" x="415" y="163" style="font-size: 24px">0</text>
  <text class="grey" x="595" y="163" style="font-size: 24px">0</text>
  <text class="green" x="775" y="163" style="font-size: 24px" font-weight="bold">1</text>
  <rect class="box" x="30" y="196" width="830" height="46" rx="4" />
  <text class="mono cyan start" x="50" y="219" style="font-size: 20px">p.c</text>
  <text class="mono small start" x="200" y="219" style="font-size: 15px">color: blue</text>
  <text class="grey" x="415" y="219" style="font-size: 24px">0</text>
  <text class="yellow" x="595" y="219" style="font-size: 24px" font-weight="bold">1</text>
  <text class="green" x="775" y="219" style="font-size: 24px" font-weight="bold">1</text>
  <rect class="box" x="30" y="252" width="830" height="46" rx="4" />
  <text class="mono cyan start" x="50" y="275" style="font-size: 20px">p#i</text>
  <text class="mono small start" x="200" y="275" style="font-size: 15px">color: green</text>
  <text class="red" x="415" y="275" style="font-size: 24px" font-weight="bold">1</text>
  <text class="grey" x="595" y="275" style="font-size: 24px">0</text>
  <text class="green" x="775" y="275" style="font-size: 24px" font-weight="bold">1</text>
  <text class="green start" x="872" y="275" style="font-size: 17px">◀ wins</text>
  <rect class="dash" x="30" y="308" width="830" height="46" rx="4" />
  <text class="mono violet start" x="50" y="331" style="font-size: 20px">style="…"</text>
  <text class="small" x="595" y="331" style="font-size: 17px">not a selector — wins before specificity is compared</text>
  <text class="label" x="40" y="388" style="font-size: 18px">Read the three columns left to right, like digits that never carry:</text>
  <text class="mono label" x="40" y="418" style="font-size: 16px">#x  beats  .a.b.c.d.e.f.g.h.i.j.k  (1,0,0 &gt; 0,11,0)</text>
  <text class="mono label" x="40" y="448" style="font-size: 16px">*  and the combinators  (space) &gt; + ~  add nothing.</text>
</svg>
