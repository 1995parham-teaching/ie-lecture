<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530">
  <title>How the cascade picks one value out of several conflicting declarations</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .thin { fill: none; stroke: #8d97a8; stroke-width: 1.5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <text class="label" x="30" y="22" style="font-size: 17px">Two declarations set the same property on one element.</text>
  <text class="label" x="30" y="46" style="font-size: 17px">Go down the steps; the first step that tells them apart decides.</text>
  <rect x="30" y="70" width="400" height="74" rx="4" style="fill: rgba(255,145,0,0.1); stroke: #ff9100; stroke-width: 1.5" />
  <text class="orange start" x="48" y="95" style="font-size: 20px">1  Origin &amp; importance</text>
  <text class="small start" x="48" y="122" style="font-size: 16px">browser  &lt;  author  &lt;  author !important</text>
  <rect class="box" x="470" y="70" width="460" height="74" rx="4" />
  <text class="mono start" x="486" y="95" style="font-size: 15px">h1 { color: blue !important }</text>
  <text class="mono small start" x="486" y="122" style="font-size: 15px">beats  style="color: red"</text>
  <path class="thin" d="M430,107 H470" />
  <path class="line" d="M230,146 V172" />
  <text class="small start" x="242" y="159" style="font-size: 14px">still a tie</text>
  <rect x="30" y="174" width="400" height="74" rx="4" style="fill: rgba(238,130,238,0.1); stroke: #ee82ee; stroke-width: 1.5" />
  <text class="violet start" x="48" y="199" style="font-size: 20px">2  style="…" attribute</text>
  <text class="small start" x="48" y="226" style="font-size: 16px">beats every selector</text>
  <rect class="box" x="470" y="174" width="460" height="74" rx="4" />
  <text class="mono start" x="486" y="199" style="font-size: 15px">style="color: black"</text>
  <text class="mono small start" x="486" y="226" style="font-size: 15px">beats  p#i { color: green }</text>
  <path class="thin" d="M430,211 H470" />
  <path class="line" d="M230,250 V276" />
  <text class="small start" x="242" y="263" style="font-size: 14px">still a tie</text>
  <rect x="30" y="278" width="400" height="74" rx="4" style="fill: rgba(255,204,0,0.1); stroke: #ffcc00; stroke-width: 1.5" />
  <text class="yellow start" x="48" y="303" style="font-size: 20px">3  Specificity</text>
  <text class="small start" x="48" y="330" style="font-size: 16px">(IDs, classes, types)</text>
  <rect class="box" x="470" y="278" width="460" height="74" rx="4" />
  <text class="mono start" x="486" y="303" style="font-size: 15px">p.c { color: blue }</text>
  <text class="mono small start" x="486" y="330" style="font-size: 15px">beats  p { color: red }</text>
  <path class="thin" d="M430,315 H470" />
  <path class="line" d="M230,354 V380" />
  <text class="small start" x="242" y="367" style="font-size: 14px">still a tie</text>
  <rect x="30" y="382" width="400" height="74" rx="4" style="fill: rgba(0,229,255,0.1); stroke: #00e5ff; stroke-width: 1.5" />
  <text class="cyan start" x="48" y="407" style="font-size: 20px">4  Order of appearance</text>
  <text class="small start" x="48" y="434" style="font-size: 16px">the later one wins</text>
  <rect class="box" x="470" y="382" width="460" height="74" rx="4" />
  <text class="mono start" x="486" y="407" style="font-size: 15px">p { color: red }  …  p { color: blue }</text>
  <text class="mono small start" x="486" y="434" style="font-size: 15px">blue wins</text>
  <path class="thin" d="M430,419 H470" />
  <text class="label" x="30" y="490" style="font-size: 15px">@layer adds a step between 2 and 3 (CSS Cascade 5). Inherited values lose to any rule</text>
  <text class="label" x="30" y="512" style="font-size: 15px">that targets the element itself, even an !important one on the parent.</text>
</svg>
