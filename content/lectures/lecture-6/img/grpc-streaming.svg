<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <title>The four kinds of gRPC method: unary, server streaming, client streaming and bidirectional streaming</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .hot { fill: rgba(255, 145, 0, 0.14); stroke: #ff9100; stroke-width: 2; }
    .cool { fill: rgba(0, 229, 255, 0.10); stroke: #00e5ff; stroke-width: 2; }
    .good { fill: rgba(118, 255, 3, 0.10); stroke: #76ff03; stroke-width: 2; }
    .bad { fill: rgba(255, 82, 82, 0.12); stroke: #ff5252; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .plain { fill: none; stroke: #cfd3da; stroke-width: 2; }
    .brace { fill: none; stroke: #8d97a8; stroke-width: 2; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; } .grey { fill: #8d97a8; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <rect class="box" x="10" y="10" width="430" height="250" rx="6" />
  <text class="start orange" x="26" y="34" style="font-size: 20px">Unary</text>
  <text class="mono" x="26" y="64" style="text-anchor: start; font-size: 15px">rpc GetCourse(CourseRequest)</text>
  <text class="mono" x="62" y="86" style="text-anchor: start; font-size: 15px">returns (Course)</text>
  <text class="small" x="80" y="110" style="font-size: 15px">client</text>
  <text class="small" x="370" y="110" style="font-size: 15px">server</text>
  <path class="dash" d="M80,122 L80,246" />
  <path class="dash" d="M370,122 L370,246" />
  <path class="line" d="M80,138 L368,148" />
  <text class="small mono" x="225" y="135" style="font-size: 12px">CourseRequest</text>
  <path class="line" d="M370,168 L82,178" />
  <text class="small mono" x="225" y="165" style="font-size: 12px">Course</text>
  <rect class="box" x="460" y="10" width="430" height="250" rx="6" />
  <text class="start cyan" x="476" y="34" style="font-size: 20px">Server streaming</text>
  <text class="mono" x="476" y="64" style="text-anchor: start; font-size: 15px">rpc ListStudents(CourseRequest)</text>
  <text class="mono" x="512" y="86" style="text-anchor: start; font-size: 15px">returns (<tspan class="yellow">stream</tspan> Student)</text>
  <text class="small" x="530" y="110" style="font-size: 15px">client</text>
  <text class="small" x="820" y="110" style="font-size: 15px">server</text>
  <path class="dash" d="M530,122 L530,246" />
  <path class="dash" d="M820,122 L820,246" />
  <path class="line" d="M530,138 L818,148" />
  <text class="small mono" x="675" y="135" style="font-size: 12px">CourseRequest</text>
  <path class="line" d="M820,168 L532,178" />
  <text class="small mono" x="675" y="165" style="font-size: 12px">Student</text>
  <path class="line" d="M820,198 L532,208" />
  <text class="small mono" x="675" y="195" style="font-size: 12px">Student</text>
  <path class="line" d="M820,228 L532,238" />
  <text class="small mono" x="675" y="225" style="font-size: 12px">Student</text>
  <rect class="box" x="10" y="280" width="430" height="250" rx="6" />
  <text class="start violet" x="26" y="304" style="font-size: 20px">Client streaming</text>
  <text class="mono" x="26" y="334" style="text-anchor: start; font-size: 15px">rpc Enroll(<tspan class="yellow">stream</tspan> Student)</text>
  <text class="mono" x="62" y="356" style="text-anchor: start; font-size: 15px">returns (Course)</text>
  <text class="small" x="80" y="380" style="font-size: 15px">client</text>
  <text class="small" x="370" y="380" style="font-size: 15px">server</text>
  <path class="dash" d="M80,392 L80,516" />
  <path class="dash" d="M370,392 L370,516" />
  <path class="line" d="M80,408 L368,418" />
  <text class="small mono" x="225" y="405" style="font-size: 12px">Student</text>
  <path class="line" d="M80,438 L368,448" />
  <text class="small mono" x="225" y="435" style="font-size: 12px">Student</text>
  <path class="line" d="M80,468 L368,478" />
  <text class="small mono" x="225" y="465" style="font-size: 12px">Student</text>
  <path class="line" d="M370,498 L82,508" />
  <text class="small mono" x="225" y="495" style="font-size: 12px">Course</text>
  <rect class="box" x="460" y="280" width="430" height="250" rx="6" />
  <text class="start green" x="476" y="304" style="font-size: 20px">Bidirectional</text>
  <text class="mono" x="476" y="334" style="text-anchor: start; font-size: 15px">rpc Watch(<tspan class="yellow">stream</tspan> CourseRequest)</text>
  <text class="mono" x="512" y="356" style="text-anchor: start; font-size: 15px">returns (<tspan class="yellow">stream</tspan> Course)</text>
  <text class="small" x="530" y="380" style="font-size: 15px">client</text>
  <text class="small" x="820" y="380" style="font-size: 15px">server</text>
  <path class="dash" d="M530,392 L530,516" />
  <path class="dash" d="M820,392 L820,516" />
  <path class="line" d="M530,408 L818,418" />
  <text class="small mono" x="675" y="405" style="font-size: 12px">CourseRequest</text>
  <path class="line" d="M530,468 L818,478" />
  <text class="small mono" x="675" y="465" style="font-size: 12px">CourseRequest</text>
  <path class="line" d="M820,438 L532,448" />
  <text class="small mono" x="675" y="435" style="font-size: 12px">Course</text>
  <path class="line" d="M820,498 L532,508" />
  <text class="small mono" x="675" y="495" style="font-size: 12px">Course</text>
</svg>
