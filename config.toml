locale = 'en-us'
title = 'IE Lecture'
staticDir = ['fonts']
enableGitInfo = true

[params]
semester = "Fall 2026"

# the lectures are written as raw html pages, and hugo denies the
# text/html content format by default since v0.16x
[security]
allowContent = ['^text/html$', '^text/markdown$']

[module]

[[module.mounts]]
source = 'static'
target = 'static'
